<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

:root{
--blue:#1687ff;
--blue2:#0066ff;
--dark:#050b14;
--card:#0b1420;
--border:#17283c;
--muted:#8292a5;
}

body{
background:var(--dark);
color:#fff;
min-height:100vh;
padding-top:60px;
padding-bottom:70px;
}

button{
border:0;
cursor:pointer;
color:#fff;
}

input{
outline:none;
}

button:active{
transform:scale(.96);
}

/* TOP */

.top{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#07111d;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
z-index:1000;
padding:0 10px;
}

.logo{
font-size:21px;
font-weight:bold;
}

.top-actions{
margin-left:auto;
display:flex;
gap:5px;
}

.top-btn{
background:#102238;
width:38px;
height:38px;
border-radius:50%;
font-size:18px;
}

/* PAGES */

.page{
display:none;
min-height:calc(100vh - 130px);
}

.page.active{
display:block;
}

/* CARD */

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:15px;
margin:12px;
padding:15px;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:13px;
}

.muted{
color:var(--muted);
font-size:13px;
}

.field{
margin-bottom:12px;
}

.field input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #20354d;
background:#081321;
color:#fff;
}

.field input:focus{
border-color:var(--blue);
}

/* BUTTONS */

.primary{
width:100%;
padding:14px;
border-radius:11px;
background:linear-gradient(
135deg,#1687ff,#005ce6
);
color:#fff;
font-weight:bold;
}

.secondary{
width:100%;
padding:13px;
border-radius:11px;
background:#102238;
color:#fff;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:68px;
background:#07111d;
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
z-index:1000;
}

.nav{
background:none;
font-size:10px;
color:#77889b;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
min-width:55px;
}

.nav-icon{
font-size:22px;
}

.nav.active{
color:var(--blue);
}

.post-button{
width:48px;
height:44px;
border-radius:14px;
background:linear-gradient(
135deg,#1687ff,#005ce6
);
font-size:28px;
font-weight:bold;
box-shadow:
0 5px 18px rgba(0,120,255,.35);
}

/* VIDEO */

.video-card{
margin-bottom:18px;
background:#07111d;
border-bottom:1px solid var(--border);
}

.video-wrap{
position:relative;
background:#000;
}

.media{
width:100%;
display:block;
max-height:72vh;
object-fit:contain;
background:#000;
}

.video-info{
padding:10px 13px;
}

.video-user{
font-weight:bold;
display:flex;
align-items:center;
gap:7px;
margin-bottom:8px;
}

.poster-avatar{
width:35px;
height:35px;
border-radius:50%;
background:#17314d;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}

.poster-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.video-title{
font-size:14px;
line-height:1.4;
color:#e9f2ff;
}

/* TIKTOK ACTIONS */

.video-actions{
display:flex;
flex-direction:column;
align-items:center;
gap:13px;
position:absolute;
right:9px;
bottom:78px;
z-index:20;
}

.side-action{
background:rgba(5,15,27,.72);
width:48px;
height:48px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
border:1px solid rgba(
255,255,255,.08
);
}

.side-action.like-active{
background:#073b72;
}

.side-profile{
width:48px;
height:48px;
border-radius:50%;
border:2px solid var(--blue);
overflow:hidden;
background:#102238;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.side-profile img{
width:100%;
height:100%;
object-fit:cover;
}

.sound-used{
padding:10px 13px;
font-size:12px;
color:#8ea1b7;
border-top:1px solid #101e2d;
}

/* PROFILE */

.profile-head{
text-align:center;
padding:20px 10px;
}

.profile-avatar{
width:95px;
height:95px;
border-radius:50%;
background:#102238;
border:3px solid var(--blue);
margin:auto;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
}

.profile-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.profile-name{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.profile-username{
color:var(--muted);
font-size:13px;
margin-top:3px;
}

.stats{
display:flex;
justify-content:center;
gap:28px;
margin:18px 0;
text-align:center;
}

.stat{
min-width:65px;
}

.stat b{
display:block;
font-size:18px;
}

.stat span{
font-size:11px;
color:var(--muted);
}

.profile-buttons{
display:flex;
gap:8px;
margin:10px 12px;
}

.profile-buttons button{
flex:1;
}

.profile-tabs{
display:flex;
border-top:1px solid var(--border);
border-bottom:1px solid var(--border);
margin-top:15px;
}

.profile-tab{
flex:1;
padding:13px;
background:none;
color:var(--muted);
}

.profile-tab.active{
color:var(--blue);
border-bottom:2px solid var(--blue);
}

.profile-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
margin-top:2px;
}

.grid-video{
height:160px;
width:100%;
object-fit:cover;
background:#000;
}

/* SEARCH */

.search-result{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--border);
}

.search-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#102238;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.search-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* COMMENTS */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
z-index:2000;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.modal-box{
background:#081321;
width:100%;
max-height:82vh;
border-radius:20px 20px 0 0;
padding:15px;
border-top:1px solid #17314d;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.close-btn{
background:#14263b;
width:36px;
height:36px;
border-radius:50%;
}

.comment-item{
display:flex;
gap:9px;
padding:11px 0;
border-bottom:1px solid #17283c;
}

.comment-avatar{
width:35px;
height:35px;
border-radius:50%;
background:#17314d;
overflow:hidden;
flex-shrink:0;
}

.comment-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

/* UPLOAD */

.preview-video{
width:100%;
max-height:300px;
object-fit:contain;
border-radius:12px;
background:#000;
}

.effect-row{
display:flex;
gap:7px;
overflow-x:auto;
padding:5px 0;
}

.effect-btn{
background:#102238;
padding:9px 13px;
border-radius:9px;
white-space:nowrap;
}

.effect-btn.active{
background:var(--blue);
}

/* AUTH */

.auth-box{
margin-top:30px;
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:50px;
}

.show-pass{
position:absolute;
right:7px;
top:7px;
width:38px;
height:38px;
background:#102238;
border-radius:8px;
}

/* PEOPLE */

.person-row{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--border);
}

.empty{
padding:45px 20px;
text-align:center;
color:var(--muted);
}

@media(min-width:700px){

.video-card{
max-width:700px;
margin:0 auto 20px;
}

.card{
max-width:700px;
margin-left:auto;
margin-right:auto;
}

}

</style>
</head>

<script>

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let selectedVideoId=null;
let selectedProfileId=null;
let postEffect="none";

function $(id){
return document.getElementById(id);
}

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function showPage(page){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

const target=$(page+"Page");

if(target){
target.classList.add("active");
}

document
.querySelectorAll(".nav")
.forEach(n=>{
n.classList.remove("active");
});

if(page==="home")
$("navHome")?.classList.add("active");

if(page==="suggestions")
$("navPeople")?.classList.add("active");

if(page==="messages")
$("navMessages")?.classList.add("active");

if(page==="profile")
$("navProfile")?.classList.add("active");

if(page==="home")
loadFeed();

if(page==="profile")
loadMyProfile();

if(page==="suggestions")
loadSuggestions();

if(page==="notifications")
loadNotifications();

if(page==="messages")
loadMessages();

window.scrollTo(0,0);

}

function requireLogin(){

if(!user){

alert("Please login first.");

showPage("login");

return false;

}

return true;

}

function togglePassword(id,button){

const input=$(id);

if(!input)return;

if(input.type==="password"){

input.type="text";

button.textContent="🙈";

}else{

input.type="password";

button.textContent="👁";

}

}
/* ================================
   REGISTER
================================ */

async function register(){

const phone =
$("regPhone").value.trim();

const email =
$("regEmail").value.trim();

const name =
$("regName").value.trim();

const password =
$("regPassword").value;

if(!phone || !name || !password){

alert("Fill phone, name and password");

return;

}

if(password.length < 6){

alert("Password must be at least 6 characters");

return;

}

const {data,error} =
await sb.auth.signUp({

phone:phone,
password:password,

options:{
data:{
full_name:name,
email:email
}
}

});

if(error){

alert(error.message);

return;

}

if(!data.user){

alert("Account creation failed");

return;

}

const profileData = {

id:data.user.id,
full_name:name,
phone:phone

};

if(email){

profileData.email=email;

}

const {error:profileError} =
await sb
.from("profiles")
.upsert(profileData);

if(profileError){

alert(profileError.message);

return;

}

alert("✅ Account created successfully");

showPage("login");

}


/* ================================
   LOGIN
================================ */

async function login(){

const phone =
$("loginPhone").value.trim();

const password =
$("loginPassword").value;

if(!phone || !password){

alert("Enter phone and password");

return;

}

const {data,error} =
await sb.auth.signInWithPassword({

phone:phone,
password:password

});

if(error){

alert(error.message);

return;

}

user=data.user;

alert("✅ Welcome back");

showPage("home");

await loadFeed();
await loadMyProfile();
await loadSuggestions();

}


/* ================================
   LOGOUT
================================ */

async function logout(){

await sb.auth.signOut();

user=null;

showPage("login");

}


/* ================================
   GET PROFILE
================================ */

async function getProfile(id){

const {data,error} =
await sb
.from("profiles")
.select("*")
.eq("id",id)
.maybeSingle();

if(error){

console.log(error);

return null;

}

return data;

}


/* ================================
   CHECK FOLLOW
================================ */

async function isFollowing(id){

if(!user || !id){

return false;

}

const {data} =
await sb
.from("followers")
.select("id")
.eq("follower_id",user.id)
.eq("following_id",id)
.maybeSingle();

return !!data;

}


/* ================================
   FOLLOW / UNFOLLOW
================================ */

async function followUser(id,button){

if(!requireLogin()){

return;

}

if(id===user.id){

return;

}

const following =
await isFollowing(id);

if(following){

const {error} =
await sb
.from("followers")
.delete()
.eq("follower_id",user.id)
.eq("following_id",id);

if(error){

alert(error.message);

return;

}

if(button){

button.textContent="Follow";

button.classList.remove("following");

}

}else{

const {error} =
await sb
.from("followers")
.insert({

follower_id:user.id,
following_id:id

});

if(error){

alert(error.message);

return;

}

if(button){

button.textContent="Following";

button.classList.add("following");

}

}

}


/* ================================
   SUGGESTIONS
================================ */

async function loadSuggestions(){

const box=$("suggestionsList");

if(!box)return;

const {data,error} =
await sb
.from("profiles")
.select("*")
.limit(20);

if(error){

console.log(error);

return;

}

box.innerHTML="";

for(const p of data || []){

if(user && p.id===user.id){

continue;

}

const following =
await isFollowing(p.id);

const div =
document.createElement("div");

div.className="suggestion";

div.innerHTML=`

<div class="suggestionInfo"
onclick="openProfile('${p.id}')">

<img
src="${escapeHtml(
p.avatar_url ||
'https://via.placeholder.com/50'
)}">

<div>

<strong>
${escapeHtml(
p.full_name || "User"
)}
</strong>

<small>
@${escapeHtml(
p.username || ""
)}
</small>

</div>

</div>

<button
class="followBtn"
onclick="followUser(
'${p.id}',this
)">

${following ? "Following" : "Follow"}

</button>

`;

box.appendChild(div);

}

}


/* ================================
   OPEN PROFILE
================================ */

async function openProfile(id){

const profile =
await getProfile(id);

if(!profile){

alert("Profile not found");

return;

}

selectedProfileId=id;

const {count:followers} =
await sb
.from("followers")
.select("*",{count:"exact",head:true})
.eq("following_id",id);

const {count:following} =
await sb
.from("followers")
.select("*",{count:"exact",head:true})
.eq("follower_id",id);

const {data:videos} =
await sb
.from("videos")
.select("id")
.eq("user_id",id);

let likes=0;

for(const video of videos || []){

const {count} =
await sb
.from("likes")
.select("*",{count:"exact",head:true})
.eq("video_id",video.id);

likes += count || 0;

}

const avatar =
profile.avatar_url ||
"https://via.placeholder.com/100";

$("profilePage").innerHTML=`

<div class="profileTop">

<img
class="profileAvatar"
src="${escapeHtml(avatar)}">

<h2>
${escapeHtml(
profile.full_name || "User"
)}
</h2>

<p>
@${escapeHtml(
profile.username || ""
)}
</p>

<div class="stats">

<div>
<b>${following || 0}</b>
<span>Following</span>
</div>

<div>

/* ================================
   PROFILE PICTURE
================================ */

async function uploadAvatar(){

if(!requireLogin()){

return;

}

const input =
document.createElement("input");

input.type="file";

input.accept="image/*";

input.onchange=async()=>{

const file=input.files[0];

if(!file)return;

const ext =
file.name.split(".").pop();

const path =
`avatars/${user.id}/avatar_${Date.now()}.${ext}`;

const {error:uploadError} =
await sb
.storage
.from("Videos")
.upload(path,file,{
upsert:true
});

if(uploadError){

alert(uploadError.message);

return;

}

const {data:urlData} =
sb
.storage
.from("Videos")
.getPublicUrl(path);

const avatarUrl =
urlData.publicUrl;

const {error} =
await sb
.from("profiles")
.update({
avatar_url:avatarUrl
})
.eq("id",user.id);

if(error){

alert(error.message);

return;

}

alert("✅ Profile picture updated");

await loadMyProfile();

};

input.click();

}

/* ================================
   SHARE
================================ */

async function sharePost(id){

const url=
window.location.origin +
window.location.pathname +
"?video="+id;

if(navigator.share){

try{

await navigator.share({

title:"We Media",
text:"Check this video on We Media",
url:url

});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(url);

alert("✅ Link copied");

}catch(e){

prompt(
"Copy this link:",
url
);

}

}

/* ================================
   UPLOAD VIDEO
================================ */

async function uploadPost(){

if(!requireLogin()){

return;

}

const input=
$("videoFile");

const file=
input.files[0];

if(!file){

alert("Select a video first");

return;

}

const title=
$("videoTitle").value.trim();

const ext=
file.name.split(".").pop();

const path=
`videos/${user.id}/video_${Date.now()}.${ext}`;

const {error:uploadError} =
await sb
.storage
.from("Videos")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);

if(uploadError){

alert(uploadError.message);

return;

}

const {data:urlData} =
sb
.storage
.from("Videos")
.getPublicUrl(path);

const videoUrl=
urlData.publicUrl;

const {error} =
await sb
.from("videos")
.insert({

user_id:user.id,
video_url:videoUrl,
title:title

});

if(error){

alert(error.message);

return;

}

alert("✅ Video uploaded successfully");

input.value="";

$("videoPreview").src="";

$("videoTitle").value="";

showPage("home");

await loadFeed();

}

================================ */

async function openMessage(id){

if(!requireLogin())return;

showPage("messages");

const box=$("messageList");

if(!box)return;

box.innerHTML="<p>Loading messages...</p>";

const {data,error}=await sb
.from("messages")
.select("*")
.or(
`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`
)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=
`<p>${escapeHtml(error.message)}</p>`;

return;

}

box.innerHTML="";

for(const m of data || []){

const div=document.createElement("div");

div.className=
m.sender_id===user.id
?"message mine"
:"message";

div.innerHTML=
escapeHtml(
m.message || m.text || ""
);

box.appendChild(div);

}

}

   SEND MESSAGE

async function sendMessage(receiverId){

const input=$("messageInput");
