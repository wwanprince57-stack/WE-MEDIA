<style>
*{

body{

button{

header{

/* HOME */

.refresh{

.stats{

.actions{

/* COMMENTS */

.commentBox{

.commentBox input{

.commentBox button{

.comments{

/* AUTH */

.auth{

.authBox{

}

.authBox p{

}

.authBox input{
 width:100%;
 padding:13px;
 margin:7px 0;
 background:#111;
 color:#fff;
 border:1px solid #333;

 outline:none;
}

.mainBtn{
 width:100%;
 margin-top:12px;
 padding:13px;
 border:0;
 border-radius:25px;
 background:#00e5ff;
 color:#000;
 font-weight:bold;
}

.switchBtn{
 width:100%;
 margin-top:17px;
 background:none;
 border:0;
 color:#00e5ff;
}

.password{
 position:relative;
}

.password input{
 padding-right:55px;
}

.eye{
 position:absolute;
 right:10px;
 top:16px;
 background:none;
 border:0;
 color:#aaa;
}

/* UPLOAD */

.upload{
 padding:25px 15px;
}

.uploadBox{
 border:1px dashed #555;
 border-radius:15px;
 padding:25px 18px;
 text-align:center;
}

.uploadBox p{
 color:#888;
 margin:10px 0;
}

.fileInput{
 width:100%;
 margin:20px 0;
 color:#fff;
}

.preview video{
 width:100%;
 margin-top:15px;
 border-radius:12px;
}

.uploadBtn{
 margin-top:18px;
 padding:12px 24px;
 border:0;
 border-radius:25px;
 background:#00e5ff;
 color:#000;
 font-weight:bold;
}

#uploadStatus{
 margin-top:15px;
 font-size:14px;
}

/* SEARCH */

.search{
 padding:20px 15px;
}

.search input{
 width:100%;
 padding:13px;
 background:#111;
 color:#fff;
 border:1px solid #333;
 border-radius:10px;
 outline:none;
 margin:15px 0;
}

.user{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:14px 5px;
 border-bottom:1px solid #222;
}

.followBtn{
 border:0;
 background:#00e5ff;
 color:#000;
 border-radius:20px;
 padding:8px 15px;
 font-weight:bold;
}

.following{
 background:#333;
 color:#fff;
}

/* PROFILE */

.profile{
 text-align:center;
 padding:30px 18px;
}

.avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 background:#00e5ff;
 color:#000;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:10px auto 15px;
 font-size:35px;
 font-weight:bold;
}

.profileEmail{
 color:#888;
 margin-top:7px;
 font-size:13px;
}

.profileStats{
 display:flex;
 justify-content:space-around;
 margin-top:30px;
 padding:20px 0;
 border-top:1px solid #222;
 border-bottom:1px solid #222;
}

.profileStats b{
 font-size:20px;
}

.profileStats small{

}

.profileBtn{
 margin-top:18px;
 padding:11px 24px;
 border-radius:22px;
 border:1px solid #333;

}

.logout{
 background:#ff3158;
 border:0;
}

/* NAV */

.nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:70px;
 background:#080808;
 border-top:1px solid #222;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:100;
}

.nav button{
 background:none;
 border:0;
 color:#888;
 font-size:12px;
}

.nav button.active{
 color:#00e5ff;
}

.icon{
 display:block;
 font-size:23px;
 margin-bottom:3px;
}

.hide{
 display:none!important;
}
</style>
</head>

<body>

<header>

<div class="logo">
We <span>Media</span>
</div>

<button id="topButton"
class="headerBtn"
onclick="openLogin()">
Login
</button>

<!-- HOME -->

<!-- SEARCH -->

<div class="search">

<h2>Search People 🔎</h2>

<input
id="searchInput"
placeholder="Search username..."
oninput="searchUsers()">

<!-- PROFILE -->

<section id="profile" class="page">

<div class="profile">

</div>

<h2 id="profileName">

</h2>

<div id="profileEmail"
class="profileEmail">
Not logged in
</div>

<div class="profileStats">

<div>
<b id="videoCount">0</b>
<br>
<small>Videos</small>
</div>

<div>
<b id="followersCount">0</b>

<div class="authBox">

<h2>Create Account 🚀</h2>

<input
id="registerUsername"
type="text"
placeholder="Username">

<input
id="registerEmail"
type="email"
placeholder="Email">

<div class="password">

<input
id="registerPassword"
type="password"
placeholder="Password">

class="eye"
onclick="showPassword('registerPassword',this)">
👁️
</button>

class="mainBtn"

CREATE ACCOUNT

<!-- NAVIGATION -->

<nav class="nav">

id="homeNav"
class="active"
onclick="showPage('home',this)">
<span class="icon">🏠</span>
Home
</button>

onclick="showPage('search',this)">
<span class="icon">🔎</span>
Search
</button>

<button
onclick="showPage('upload',this)">
<span class="icon">➕</span>
Upload
</button>

<button
onclick="showPage('profile',this)">
<span class="icon">👤</span>
Profile
</button>

</nav>


<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
USER
========================================= */

let currentUser = null;


/* =========================================
MESSAGE
========================================= */

function showMessage(text){

const box =
document.getElementById("message");

box.innerText=text;
box.style.display="block";

setTimeout(function(){
box.style.display="none";
},3000);

}


/* =========================================
NAVIGATION
========================================= */

function showPage(name,button){

document.querySelectorAll(".page")
.forEach(function(page){

page.classList.remove("active");

});

const page =
document.getElementById(name);

if(page){
page.classList.add("active");
}

document.querySelectorAll(".nav button")
.forEach(function(btn){

btn.classList.remove("active");

});

if(button){
button.classList.add("active");
}

window.scrollTo(0,0);

if(name==="home"){
loadVideos();
}

if(name==="profile"){
loadProfile();
}

}


/* =========================================
LOGIN PAGE
========================================= */

function openLogin(){

showPage("login");

}

function openRegister(){

showPage("register");

}


/* =========================================
PASSWORD
========================================= */

function showPassword(id,button){

const input =
document.getElementById(id);

if(input.type==="password"){

input.type="text";
button.innerText="🙈";

}else{

input.type="password";
button.innerText="👁️";

}

}


/* =========================================
REGISTER
========================================= */

async function register(){

const username =
document.getElementById("registerUsername")
.value.trim();

const email =
document.getElementById("registerEmail")
.value.trim();

const password =
document.getElementById("registerPassword")
.value;

if(username.length<3){

alert("Username must have at least 3 characters.");
return;

}

if(!email){

alert("Enter your email.");
return;

}

if(password.length<6){

alert("Password must have at least 6 characters.");
return;

}

try{

const result =
await db.auth.signUp({

email:email,
password:password,

options:{
data:{
username:username
}
}

});

if(result.error){

alert(result.error.message);
return;

}

if(result.data.session){

currentUser=result.data.user;

showMessage(
"✅ Account created successfully!"
);

updateHeader();

showPage("home");

}else{

alert(
"Account created! Check your email to confirm your account, then login."
);

openLogin();

}

}catch(error){

console.log(error);

alert("Something went wrong creating the account.");

}

}


/* =========================================
LOGIN
========================================= */

async function login(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

alert("Enter email and password.");
return;

}

try{

const result =
await db.auth.signInWithPassword({

email:email,
password:password

});

if(result.error){

alert(result.error.message);
return;

}

currentUser=result.data.user;

showMessage("✅ Login successful!");

updateHeader();

showPage("home");

}catch(error){

console.log(error);

alert("Login failed.");

}

}


/* =========================================
LOGOUT
========================================= */

async function logout(){

try{

await db.auth.signOut();

}catch(e){

console.log(e);

}

currentUser=null;

updateHeader();

showMessage("Logged out successfully.");

showPage("home");

}


/* =========================================
HEADER
========================================= */

function updateHeader(){

const button =
document.getElementById("topButton");

if(currentUser){

button.innerText="Profile";

button.onclick=function(){

showPage("profile");

loadProfile();

};

}else{

button.innerText="Login";

button.onclick=function(){

openLogin();

};

}

}


/* =========================================
AUTH CHECK
========================================= */

async function checkLogin(){

try{

const result =
await db.auth.getSession();

currentUser =
result.data.session
? result.data.session.user
: null;

updateHeader();

}catch(error){

console.log(error);

}

}


/* =========================================
AUTH LISTENER
========================================= */

db.auth.onAuthStateChange(
function(event,session){

currentUser =
session ? session.user : null;

updateHeader();

}
);


/* =========================================
DEMO VIDEOS
========================================= */

const demoVideos=[

{
path:"demo_flower",
url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
username:"@wemedia",
caption:"Welcome to We Media 🎬"
},

{
path:"demo_bunny",
url:"https://www.w3schools.com/html/mov_bbb.mp4",
username:"@wemedia",
caption:"Watch videos and share on We Media 🔥"
}

];


/* =========================================
LOAD VIDEOS
========================================= */

async function loadVideos(){

const feed =
document.getElementById("feed");

feed.innerHTML =
'<div class="loading">Loading videos 🎬...</div>';

let videos=[];

try{

const result =
await db.storage
.from("Videos")
.list("",{

limit:100,

sort:{
column:"created_at",
order:"desc"
}

});

if(!result.error){

const files =
result.data || [];

files.forEach(function(file){

if(
file.name &&
/\.(mp4|webm|mov|m4v|avi)$/i
.test(file.name)
){

const publicUrl =
db.storage
.from("Videos")
.getPublicUrl(file.name)
.data.publicUrl;

videos.push({

path:file.name,
url:publicUrl,
username:"@wemedia",
caption:"New video on We Media 🎬"

});

}

});

}

}catch(error){

console.log("Video loading:",error);

}


/* Always keep demo videos */

videos =
videos.concat(demoVideos);

feed.innerHTML="";

if(videos.length===0){

feed.innerHTML =
'<div class="empty">No videos yet 🎬</div>';

return;

}

videos.forEach(function(video,index){

createVideo(video,index);

});

}


/* =========================================
CREATE VIDEO
========================================= */

function createVideo(video,index){

const feed =
document.getElementById("feed");

const card =
document.createElement("div");

card.className="videoCard";


const player =
document.createElement("video");

player.className="video";

player.controls=true;
player.loop=true;
player.playsInline=true;

player.src=video.url;


player.addEventListener(
"play",
function(){

if(!video.path.startsWith("demo_")){

addView(video.path);

}

},
{once:true}
);


const info =
document.createElement("div");

info.className="videoInfo";

info.innerHTML=

'<div class="username">'+
safe(video.username)+
'</div>'+

'<div class="caption">'+
safe(video.caption)+
'</div>'+

'<div class="stats">'+

'<span id="view'+index+'">👁️ 0 views</span>'+

' • '+

'<span id="like'+index+'">❤️ 0 likes</span>'+

' • '+

'<span id="comment'+index+'">💬 0 comments</span>'+

'</div>';


const actions =
document.createElement("div");

actions.className="actions";

actions.innerHTML=

'<button class="action" id="likeBtn'+index+'">❤️ Like</button>'+

'<button class="action" id="commentBtn'+index+'">💬 Comment</button>'+

'<button class="action" id="shareBtn'+index+'">↗ Share</button>';


const commentBox =
document.createElement("div");

commentBox.className="commentBox";

commentBox.id="commentBox"+index;

commentBox.innerHTML=

'<input id="commentInput'+index+'" placeholder="Write a comment...">'+
'<button>Send</button>';


const comments =
document.createElement("div");

comments.className="comments";

comments.id="comments"+index;


card.appendChild(player);
card.appendChild(info);
card.appendChild(actions);
card.appendChild(commentBox);
card.appendChild(comments);

feed.appendChild(card);


/* LIKE */

document.getElementById(
"likeBtn"+index
).onclick=function(){

likeVideo(video.path,index,this);

};


/* COMMENT */

document.getElementById(
"commentBtn"+index
).onclick=function(){

toggleComment(index);

};


/* SHARE */

document.getElementById(
"shareBtn"+index
).onclick=function(){

shareVideo(video.url);

};


/* SEND COMMENT */

commentBox.querySelector("button")
.onclick=function(){

sendComment(video.path,index);

};


loadStats(video.path,index);

}


/* =========================================
LIKE
========================================= */

async function likeVideo(path,index,button){

if(!currentUser){

showMessage("Login first to like videos.");

openLogin();

return;

}

if(path.startsWith("demo_")){

button.classList.toggle("liked");

button.innerText =
button.classList.contains("liked")
? "❤️ Liked"
: "❤️ Like";

return;

}

try{

const found =
await db
.from("video_likes")
.select("id")
.eq("video_path",path)
.eq("user_id",currentUser.id)
.maybeSingle();

if(found.data){

await db
.from("video_likes")
.delete()
.eq("id",found.data.id);

button.classList.remove("liked");
button.innerText="❤️ Like";

}else{

await db
.from("video_likes")
.insert({

video_path:path,
user_id:currentUser.id

});

button.classList.add("liked");
button.innerText="❤️ Liked";

}

loadStats(path,index);

}catch(error){

console.log(error);

showMessage("Like system needs setup.");

}

}


/* =========================================
COMMENTS
========================================= */

function toggleComment(index){

const box =
document.getElementById(
"commentBox"+index
);

if(box.style.display==="block"){

box.style.display="none";

}else{

box.style.display="block";

}

}


async function sendComment(path,index){

if(!currentUser){

showMessage("Login first to comment.");

openLogin();

return;

}

if(path.startsWith("demo_")){

alert("Upload a video to enable comments.");

return;

}

const input =
document.getElementById(
"commentInput"+index
);

const text =
input.value.trim();

if(!text){

return;

}

try{

const result =
await db
.from("video_comments")
.insert({

video_path:path,

user_id:currentUser.id,

username:
currentUser.user_metadata?.username
||"User",

comment:text

});

if(result.error){

alert(result.error.message);
return;

}

input.value="";

showMessage("Comment added!");

loadStats(path,index);

}catch(error){

console.log(error);

alert("Comment failed.");

}

}


/* =========================================
VIEWS
========================================= */

async function addView(path){

if(!currentUser){
return;
}

try{

const found =
await db
.from("video_views")
.select("id")
.eq("video_path",path)
.eq("viewer_id",currentUser.id)
.maybeSingle();

if(!found.data){

await db
.from("video_views")
.insert({

video_path:path,
viewer_id:currentUser.id

});

}

}catch(error){

console.log(error);

}

}


/* =========================================
STATS
========================================= */

a
