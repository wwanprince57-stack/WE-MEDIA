 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Media</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  padding-bottom:75px;
}

header{
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#00d9ff;
}

.login{
  background:#00d9ff;
  border:0;
  padding:9px 15px;
  border-radius:8px;
  font-weight:bold;
}

main{
  max-width:650px;
  margin:auto;
}

.video-card{
  background:#151515;
  margin:12px 8px;
  border-radius:12px;
  overflow:hidden;
}

.video-container{
  width:100%;
  background:#000;
}

video{
  width:100%;
  max-height:70vh;
  display:block;
  object-fit:contain;
}

.info{
  padding:14px;
}

.username{
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  margin-bottom:12px;
  color:#ddd;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  background:#292929;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 12px;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#aaa;
}

#fileInput{
  display:none;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#111;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav button{
  background:none;
  color:white;
  border:0;
  font-size:13px;
}

.upload{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#00d9ff;
  color:#000;
  font-size:28px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">We <span>Media</span></div>
  <button class="login" onclick="login()">LOGIN</button>
</header>

<main id="feed">

  <div class="empty" id="emptyMessage">
    🎥<br><br>
    No videos yet.<br>
    Tap <b>+</b> to add your first video.
  </div>

</main>

<input
  type="file"
  id="fileInput"
  accept="video/*"
  onchange="addVideo(event)"
>

<nav>
  <button onclick="home()">🏠<br>Home</button>

  <button class="upload" onclick="chooseVideo()">+</button>

  <button onclick="profile()">👤<br>Profile</button>
</nav>

<script>

function chooseVideo(){
  document.getElementById("fileInput").click();
}

function addVideo(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("video/")){
    alert("Please choose a video.");
    return;
  }

  const videoURL = URL.createObjectURL(file);

  const feed = document.getElementById("feed");

  const empty = document.getElementById("emptyMessage");

  if(empty){
    empty.remove();
  }

  const card = document.createElement("div");

  card.className = "video-card";

  card.innerHTML = `
    <div class="video-container">
      <video controls playsinline>
        <source src="${videoURL}" type="${file.type}">
        Your browser does not support video.
      </video>
    </div>

    <div class="info">

      <div class="username">@wemedia_user</div>

      <div class="caption">
        My first video on We Media 🎥🔥
      </div>

      <div class="actions">

        <button onclick="likeVideo(this)">
          ❤️ Like
        </button>

        <button onclick="commentVideo()">
          💬 Comment
        </button>

        <button onclick="shareVideo()">
          ↗ Share
        </button>

      </div>

    </div>
  `;

  feed.prepend(card);

  event.target.value = "";
}

function likeVideo(button){

  if(button.innerText.includes("Liked")){
    button.innerText = "❤️ Like";
  }else{
    button.innerText = "❤️ Liked";
  }

}

function commentVideo(){

  const comment = prompt("Write your comment:");

  if(comment){
    alert("Comment added: " + comment);
  }

}

function shareVideo(){

  if(navigator.share){

    navigator.share({
      title:"We Media",
      text:"Check out this video on We Media!",
      url:window.location.href
    });

  }else{

    navigator.clipboard.writeText(window.location.href);

    alert("We Media link copied!");

  }

}

function login(){

  alert("Login system coming next.");

}

function profile(){

  alert("Profile system coming next.");

}

function home(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

</script>

</body>
</html>
