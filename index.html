<script>/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let selectedVideoId=null;
let selectedReceiverId=null;
let postEffect="none";


/* ================================
   HELPERS
================================ */

function $(id){
return document.getElementById(id);
}


/* ================================
   PAGE NAVIGATION
================================ */

function showPage(page){

const pages=document.querySelectorAll(".page");

pages.forEach(p=>{
p.classList.remove("active");
});

const target=$(page+"Page");

if(target){
target.classList.add("active");
}

document.querySelectorAll(".nav")
.forEach(n=>{
n.classList.remove("active");
});

if(page==="home")
$("navHome")?.classList.add("active");

if(page==="suggestions")
$("navSuggestions")?.classList.add("active");

if(page==="messages")
$("navMessages")?.classList.add("active");

if(page==="profile")
$("navProfile")?.classList.add("active");

if(page==="home"){
loadFeed();
}

if(page==="suggestions"){
loadSuggestions();
}

if(page==="profile"){
loadMyProfile();
}

if(page==="notifications"){
loadNotifications();
}

if(page==="messages"){
loadMessages();
}

}


/* ================================
   AUTH CHECK
================================ */

function requireLogin(){

if(!user){

alert("Login first");

showPage("login");

return false;

}

return true;

}


/* ================================
   LOGIN
================================ */

async function login(){

const id=
$("loginId").value.trim();

const pass=
$("loginPass").value;

if(!id || !pass){

alert("Enter email/phone and password");

return;

}

const {data,error}=
await sb.auth.signInWithPassword({

email:id,
password:pass

});

if(error){

alert(error.message);

return;

}

user=data.user;

alert("✅ Login successful");

showPage("home");

loadFeed();

}


/* ================================
   REGISTER
================================ */

async function register(){

const name=
$("regName").value.trim();

const email=
$("regEmail").value.trim();

const phone=
$("regPhone").value.trim();

const pass=
$("regPass").value;

if(!name || !email || !pass){

alert("Name, email and password are required");

return;

}

if(pass.length<6){

alert("Password must be at least 6 characters");

return;

}

const {data,error}=
await sb.auth.signUp({

email:email,
password:pass,

options:{
data:{
full_name:name,
username:name,
phone:phone
}
}

});

if(error){

alert(error.message);

return;

}

if(data.user){

await sb
.from("profiles")
.upsert({

id:data.user.id,
username:name,
full_name:name,
phone:phone

},{onConflict:"id"});

}

alert("✅ Account created successfully");

showPage("login");

}


/* ================================
   LOGOUT
================================ */

async function logout(){

await sb.auth.signOut();

user=null;

showPage("home");

loadFeed();

}


/* ================================
   GET PROFILE
================================ */

async function getProfile(userId){

const {data,error}=
await sb
.from("profiles")
.select("*")
.eq("id",userId)
.maybeSingle();

if(error){

console.log(error);

return null;

}

return data;

}/* ================================
   LOAD FEED
================================ */

async function loadFeed(){

const box=$("feed");

if(!box)return;

box.innerHTML=
`<div class="card muted">Loading videos...</div>`;

const {data,error}=
await sb
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.log(error);

box.innerHTML=
`<div class="card muted">
Could not load videos.
</div>`;

return;

}

if(!data || !data.length){

box.innerHTML=
`<div class="card muted">
No videos yet. Be the first to post!
</div>`;

return;

}

box.innerHTML="";

for(const video of data){

await createVideoCard(video,box);

}

}


/* ================================
   VIDEO CARD
================================ */

async function createVideoCard(v,box){

const id=v.id;

const videoUrl=
v.video_url ||
v.url ||
"";

const title=
v.title ||
v.caption ||
"";

let profile=null;

if(v.user_id){

profile=
await getProfile(v.user_id);

}

const username=
profile?.username ||
profile?.full_name ||
"User";

const avatar=
profile?.avatar_url || "";

const card=
document.createElement("div");

card.className="video-card";

card.innerHTML=`

<video
class="media"
src="${videoUrl}"
controls
playsinline
preload="metadata">
</video>

<div class="video-info">

<div
class="video-user"
onclick="openProfile('${v.user_id}')"
style="cursor:pointer">

${avatar
? `<img
src="${avatar}"
style="
width:32px;
height:32px;
border-radius:50%;
object-fit:cover;
vertical-align:middle;
margin-right:7px">`
: "👤"}

@${escapeHtml(username)}

</div>

<div class="video-title">
${escapeHtml(title)}
</div>

</div>

<div class="video-actions">

<button
class="action"
id="like-${id}"
onclick="videoAction('like','${id}')">

<span class="action-icon">❤️</span>

</button>

<button
class="action"
onclick="videoAction('comment','${id}')">

<span class="action-icon">💬</span>

</button>

<button
class="action"
onclick="videoAction('share','${id}')">

<span class="action-icon">↗️</span>

</button>

<button
class="action"
onclick="videoAction('whatsapp','${id}')">

<span class="action-icon">🟢</span>

</button>

<button
class="action"
onclick="videoAction('sound','${id}')">

<span class="action-icon">🎵</span>

</button>

</div>

<div
class="sound-used"
id="sound-${id}">

🎵 Original sound

</div>

`;

box.appendChild(card);

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   VIDEO ACTIONS
================================ */

function videoAction(type,id){

if(type==="like"){

const btn=
document.getElementById("like-"+id);

likePost(id,btn);

}

if(type==="comment"){

commentPost(id);

}

if(type==="share"){

sharePost(id);

}

if(type==="whatsapp"){

whatsappPost(id);

}

if(type==="sound"){

showSound(
document.getElementById("sound-"+id)
?.textContent
);

}

}


/* ================================
   SHARE VIDEO
================================ */

async function sharePost(id){

const url=
window.location.origin+
window.location.pathname+
"?video="+encodeURIComponent(id);

try{

await navigator.clipboard.writeText(url);

alert("✅ Video link copied");

}catch(e){

prompt(
"Copy this video link:",
url
);

}

}


/* ================================
   WHATSAPP
================================ */

function whatsappPost(id){

const url=
window.location.origin+
window.location.pathname+
"?video="+encodeURIComponent(id);

const text=
"We Media video 🎥\n"+url;

window.open(
"https://wa.me/?text="+
encodeURIComponent(text),
"_blank"
);

}


/* ================================
   SOUND
================================ */

function showSound(sound){

alert(
sound ||
"🎵 Original sound"
);

   }/* ================================
   SEARCH USERS
================================ */

async function searchUsers(){

const input=$("searchInput");

const box=$("searchResults");

if(!input || !box)return;

const q=input.value.trim();

if(!q){

box.innerHTML="";

return;

}

const {data,error}=
await sb
.from("profiles")
.select("id,username,full_name,avatar_url")
.or(
`username.ilike.%${q}%,full_name.ilike.%${q}%`
)
.limit(30);

if(error){

console.log(error);

box.innerHTML=
`<div class="muted">
Search failed.
</div>`;

return;

}

if(!data || !data.length){

box.innerHTML=
`<div class="muted">
No users found.
</div>`;

return;

}

box.innerHTML="";

data.forEach(p=>{

const name=
p.username ||
p.full_name ||
"User";

const row=
document.createElement("div");

row.className="search-result";

row.innerHTML=`

<div class="search-avatar">

${p.avatar_url
? `<img src="${p.avatar_url}">`
: "👤"}

</div>

<div style="flex:1">

<div style="font-weight:bold">

@${escapeHtml(name)}

</div>

<div class="muted">

${escapeHtml(p.full_name || "")}

</div>

</div>

<button
class="secondary"
style="width:auto;padding:8px 12px"
onclick="openProfile('${p.id}')">

View

</button>

`;

box.appendChild(row);

});

}

const row=

row.className="comment-item";

row.textContent=
n.message ||
n.text ||
"New notification";

box.appendChild(row);

});

}


/* ================================
   MESSAGES
================================ */

async function loadMessages(){

const box=$("messagesList");

if(!box)return;

if(!user){

box.innerHTML=
`<div class="muted">
Login to see messages.
</div>`;

return;

}

const {data,error}=
await sb
.from("messages")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
)
.order("created_at",{ascending:true})
.limit(100);

if(error){

console.log(error);

box.innerHTML=
`<div class="muted">
No messages available.
</div>`;

return;

}

if(!data || !data.length){

box.innerHTML=
`<div class="muted">
No messages yet.
</div>`;

return;

}

box.innerHTML="";

data.forEach(m=>{

const row=
document.createElement("div");

row.className="message-row";

const mine=
m.sender_id===user.id;

row.innerHTML=`

<div class="message-bubble
${mine ? "message-mine" : "message-other"}">

${escapeHtml(
m.message ||
m.text ||
""
)}

</div>

`;

box.appendChild(row);

});

box.scrollTop=box.scrollHeight;

}


/* ================================
   OPEN MESSAGE
================================ */

function openMessage(userId){

if(!requireLogin())return;

selectedReceiverId=userId;

showPage("messages");

}


/* ================================
   SEND MESSAGE
================================ */

async function sendMessage(receiverId,message){

if(!requireLogin())return;

if(!receiverId)return;

const text=
String(message || "").trim();

if(!text)return;

const {error}=
await sb
.from("messages")
.insert({

sender_id:user.id,
receiver_id:receiverId,
message:text

});

if(error){

alert(error.message);

return;

}

await loadMessages();

}


/* ================================
   CAMERA / GALLERY
================================ */

function openGallery(){

const file=$("postFile");

if(file){

file.removeAttribute("capture");

file.click();

}

}


function openCamera(){

if(file){

file.setAttribute(
"capture",

);

}

   VIDEO PREVIEW
================================ */

function previewPost(){

const file=$("postFile")?.files?.[0];

const preview=$("effectPreview");

if(!file || !preview)return;

const url=
URL.createObjectURL(file);

src="${url}"

/* ================================
   EFFECTS
================================ */

function addEffects(){

const area=$("effectsArea");

if(!area)return;

area.innerHTML=`

<div
style="
font-weight:bold;
margin:12px 0 7px">

🎨 Effects

</div>

<div class="effect-row">

<button
class="effect-btn active"
onclick="setEffect('none',this)">

Normal

</button>

<button
class="effect-btn"
onclick="setEffect('gray',this)">

B&W

</button>

<button
class="effect-btn"
onclick="setEffect('warm',this)">

Warm

</button>

<button
class="effect-btn"
onclick="setEffect('soft',this)">

Soft

</button>

</div>

`;

}


function setEffect(effect,button){

postEffect=effect;

document
.querySelectorAll(".effect-btn")
.forEach(b=>{
b.classList.remove("active");
});

button?.classList.add("active");

const video=
$("effectPreview")?.querySelector("video");

if(!video)return;

if(effect==="gray")
video.style.filter="grayscale(1)";

else if(effect==="warm")
video.style.filter=
"sepia(.35) saturate(1.25)";

else if(effect==="soft")
video.style.filter=
"brightness(1.08) contrast(.92)";

else
video.style.filter="none";

}


/* ================================
   INIT EFFECTS
================================ */

addEffects();/* ================================
   UPLOAD VIDEO
================================ */

async function uploadPost(){

if(!requireLogin())return;

const title=
$("postTitle").value.trim();

const file=
$("postFile").files[0];

const msg=$("uploadMsg");

if(!file){

msg.textContent=
"❌ Select a video first";

return;

}

if(!file.type.startsWith("video/")){

msg.textContent=
"❌ Please select a video file";

return;

}

if(file.size>50*1024*1024){

msg.textContent=
"❌ Video must be below 50MB";

return;

}

msg.textContent=
"⏳ Uploading video...";


try{

const ext=
file.name.split(".").pop();

const fileName=
user.id+
"/"+
Date.now()+
"."+
ext;

const {error:uploadError}=
await sb
.storage
.from("Videos")
.upload(
fileName,
file,
{
contentType:file.type,
upsert:false
}
);

if(uploadError){

console.log(uploadError);

msg.textContent=
"❌ "+uploadError.message;

return;

}


/* ================================
   GET PUBLIC URL
================================ */

const {data:urlData}=
sb
.storage
.from("Videos")
.getPublicUrl(fileName);

const videoUrl=
urlData.publicUrl;


/* ================================
   SAVE VIDEO
================================ */

const {error:dbError}=
await sb
.from("videos")
.insert({

user_id:user.id,
title:title,
video_url:videoUrl

});

if(dbError){

console.log(dbError);

msg.textContent=
"❌ "+dbError.message;

return;

}

msg.textContent=
"✅ Video posted successfully!";


/* ================================
   CLEAR FORM
================================ */

$("postTitle").value="";

$("postFile").value="";

$("effectPreview").innerHTML="";


/* ================================
   RETURN HOME
================================ */

setTimeout(()=>{

showPage("home");

loadFeed();

},800);

}catch(error){

console.log(error);

msg.textContent=
"❌ Upload failed";

}

}

   START APP

await sb.auth.getSession();

user=

null;

}else{

);

}

================================ */

(event,session)=>{

null;

}
);

   OPEN SHARED VIDEO
================================ */

async function openSharedVideo(){

const params=
new URLSearchParams(
window.location.search
);

const videoId=
params.get("video");

if(!videoId)return;

const {data,error}=
await sb
.from("videos")
.select("*")
.eq("id",videoId)
.maybeSingle();

if(error || !data)return;

showPage("home");

if(!box)return;

box.innerHTML="";

await createVideoCard(
data,
box
);

}

}
);
