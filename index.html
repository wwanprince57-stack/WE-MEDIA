 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Media</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  padding-bottom:75px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  padding:15px;
  text-align:center;
  border-bottom:1px solid #333;
}

header h1{
  font-size:25px;
}

#feed{
  max-width:600px;
  margin:auto;
}

.video-card{
  margin-bottom:25px;
  background:#111;
  border-bottom:1px solid #333;
}

video{
  width:100%;
  max-height:650px;
  display:block;
  background:#000;
}

.info{
  padding:12px;
}

.title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:12px;
}

.stats{
  display:flex;
  gap:20px;
  margin-bottom:12px;
  color:#bbb;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:#333;
}

.like-btn.liked{
  background:#333;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#111;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav button{
  background:none;
  font-size:13px;
}

.upload-box{
  display:none;
  max-width:600px;
  margin:20px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
}

.upload-box h2{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:#fff;
}

#status{
  margin-top:12px;
  font-size:14px;
}

.profile{
  display:none;
  max-width:600px;
  margin:30px auto;
  text-align:center;
  padding:30px;
}

.profile-icon{
  font-size:70px;
  margin-bottom:15px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <h1>🎬 We Media</h1>
</header>

<div id="feed">
  <div class="empty">Loading videos...</div>
</div>

<div class="upload-box" id="uploadBox">

  <h2>📤 Upload Video</h2>

  <input
    type="text"
    id="videoTitle"
    placeholder="Video title"
  >

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <button onclick="uploadVideo()">📤 Upload</button>

  <div id="status"></div>

</div>

<div class="profile" id="profileBox">

  <div class="profile-icon">👤</div>

  <h2>We Media Profile</h2>

  <p style="color:#aaa;margin-top:10px;">
    Your profile will be available here.
  </p>

</div>

<nav>

  <button onclick="showHome()">
    🏠<br>Home
  </button>

  <button onclick="showUpload()">
    ➕<br>Upload
  </button>

  <button onclick="showProfile()">
    👤<br>Profile
  </button>

</nav>

<script>

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const BUCKET = "Videos";


async function loadVideos(){

  const feed = document.getElementById("feed");

  feed.innerHTML =
  '<div class="empty">Loading videos...</div>';

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/videos?select=*&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }

    const videos = await response.json();

    if(videos.length === 0){

      feed.innerHTML =
      '<div class="empty">' +
      'No videos yet 🎬<br>' +
      'Upload the first video!' +
      '</div>';

      return;

    }

    feed.innerHTML = "";

    videos.forEach(videoData => {

      createVideoCard(videoData);

    });

  }catch(error){

    console.error(error);

    feed.innerHTML =
    '<div class="empty">' +
    '❌ Could not load videos.' +
    '</div>';

  }

}


function createVideoCard(videoData){

  const feed =
  document.getElementById("feed");

  const card =
  document.createElement("div");

  card.className="video-card";


  const video =
  document.createElement("video");

  video.controls=true;
  video.playsInline=true;
  video.preload="metadata";
  video.src=videoData.video_url;


  let viewCount =
  Number(videoData.views || 0);

  let likeCount =
  Number(videoData.likes || 0);


  const info =
  document.createElement("div");

  info.className="info";


  const title =
  document.createElement("div");

  title.className="title";

  title.textContent =
  videoData.title || "We Media Video";


  const stats =
  document.createElement("div");

  stats.className="stats";


  const views =
  document.createElement("span");

  views.textContent =
  "👁️ " + viewCount + " views";


  const likes =
  document.createElement("span");

  likes.textContent =
  "❤️ " + likeCount + " likes";


  stats.appendChild(views);
  stats.appendChild(likes);


  const actions =
  document.createElement("div");

  actions.className="actions";


  const likeButton =
  document.createElement("button");

  likeButton.className="like-btn";

  likeButton.textContent="❤️ Like";


  let liked=false;


  likeButton.onclick = async function(){

    if(liked) return;

    liked=true;

    likeCount++;

    likes.textContent =
    "❤️ " + likeCount + " likes";

    likeButton.textContent="❤️ Liked";

    likeButton.classList.add("liked");


    try{

      await fetch(
        SUPABASE_URL +
        "/rest/v1/videos?id=eq." +
        videoData.id,
        {
          method:"PATCH",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({
            likes:likeCount
          })

        }
      );

    }catch(error){

      console.error(error);

    }

  };


  const commentButton =
  document.createElement("button");

  commentButton.textContent =
  "💬 Comment";


  commentButton.onclick=function(){

    const comment =
    prompt("Write your comment:");

    if(comment && comment.trim()){

      alert("💬 Comment added!");

    }

  };


  actions.appendChild(likeButton);
  actions.appendChild(commentButton);


  let countedView=false;


  video.addEventListener(
    "play",
    async function(){

      if(countedView) return;

      countedView=true;

      viewCount++;

      views.textContent =
      "👁️ " + viewCount + " views";


      try{

        await fetch(
          SUPABASE_URL +
          "/rest/v1/videos?id=eq." +
          videoData.id,
          {
            method:"PATCH",

            headers:{
              "apikey":SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                "application/json",
              "Prefer":
                "return=minimal"
            },

            body:JSON.stringify({
              views:viewCount
            })

          }
        );

      }catch(error){

        console.error(error);

      }

    }
  );


  info.appendChild(title);
  info.appendChild(stats);
  info.appendChild(actions);

  card.appendChild(video);
  card.appendChild(info);

  feed.appendChild(card);

}


async function uploadVideo(){

  const title =
  document.getElementById("videoTitle")
  .value.trim();

  const fileInput =
  document.getElementById("videoFile");

  const status =
  document.getElementById("status");

  const file =
  fileInput.files[0];


  if(!file){

    status.textContent =
    "Choose a video first.";

    return;

  }


  status.textContent =
  "Uploading...";


  try{

    const safeName =
    Date.now() +
    "_" +
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


    const uploadURL =
    SUPABASE_URL +
    "/storage/v1/object/" +
    BUCKET +
    "/" +
    safeName;


    const uploadResponse =
    await fetch(
      uploadURL,
      {
        method:"POST",

        headers:{
          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            file.type || "video/mp4"
        },

        body:file
      }
    );


    if(!uploadResponse.ok){

      throw new Error(
        await uploadResponse.text()
      );

    }


    const publicURL =
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    safeName;


    const dbResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/videos",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=minimal"
        },

        body:JSON.stringify({

          title:
            title || "We Media Video",

          video_url:
            publicURL,

          likes:0,

          views:0

        })

      }
    );


    if(!dbResponse.ok){

      throw new Error(
        await dbResponse.text()
      );

    }


    status.textContent =
    "✅ Video uploaded successfully!";


    document.getElementById(
      "videoTitle"
    ).value="";

    fileInput.value="";


    setTimeout(
      function(){

        showHome();
        loadVideos();

      },
      1000
    );


  }catch(error){

    console.error(error);

    status.textContent =
    "❌ Upload failed: " +
    error.message;

  }

}


function hideAll(){

  document.getElementById(
    "feed"
  ).style.display="none";

  document.getElementById(
    "uploadBox"
  ).style.display="none";

  document.getElementById(
    "profileBox"
  ).style.display="none";

}


function showHome(){

  hideAll();

  document.getElementById(
    "feed"
  ).style.display="block";

  loadVideos();

}


function showUpload(){

  hideAll();

  document.getElementById(
    "uploadBox"
  ).style.display="block";

}


function showProfile(){

  hideAll();

  document.getElementById(
    "profileBox"
  ).style.display="block";

}


showHome();

</script>

</body>
</html>
