<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#111;
padding-bottom:70px;
}

button{
border:0;
cursor:pointer;
}

.topbar{
height:58px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
position:sticky;
top:0;
z-index:50;
box-shadow:0 1px 5px #ccc;
}

.logo{
font-size:22px;
font-weight:bold;
}

.page{
display:none;
padding:12px;
max-width:650px;
margin:auto;
}

.page.active{
display:block;
}

.card{
background:#fff;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 1px 5px #ddd;
}

input,
textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
margin:7px 0;
outline:none;
font-size:15px;
}

textarea{
min-height:90px;
resize:none;
}

.primary{
width:100%;
padding:13px;
border-radius:9px;
background:#111;
color:#fff;
font-weight:bold;
margin-top:8px;
}

.secondary{
padding:10px 14px;
border-radius:8px;
background:#eee;
font-weight:bold;
}

.danger{
background:#d00;
color:#fff;
}

.row{
display:flex;
align-items:center;
gap:10px;
}

.row-between{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.video-card{
background:#fff;
border-radius:12px;
overflow:hidden;
margin-bottom:14px;
box-shadow:0 1px 5px #ddd;
}

.video-card video{
width:100%;
display:block;
background:#000;
max-height:600px;
}

.video-info{
padding:12px;
}

.video-actions{
display:flex;
gap:6px;
padding:8px 10px 12px;
overflow-x:auto;
}

.video-actions button{
background:#f0f0f0;
padding:9px 12px;
border-radius:20px;
white-space:nowrap;
}

.username{
font-weight:bold;
margin-bottom:7px;
}

.title{
margin-bottom:7px;
word-break:break-word;
}

.stats{
font-size:12px;
color:#777;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:62px;
background:#fff;
display:flex;
justify-content:space-around;
align-items:center;
z-index:100;
box-shadow:0 -1px 6px #ccc;
}

.nav button{
background:none;
font-size:12px;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
}

.nav-icon{
font-size:21px;
}

.loading{
text-align:center;
padding:30px;
color:#777;
}

.msg-error{
background:#ffe5e5;
color:#b00000;
padding:12px;
border-radius:9px;
margin-bottom:10px;
}

.profile-head{
text-align:center;
padding:20px;
}

.profile-avatar{
width:75px;
height:75px;
border-radius:50%;
background:#111;
color:#fff;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
}

.search-result,
.suggestion,
.message,
.notification{
background:#fff;
padding:12px;
border-radius:10px;
margin-bottom:8px;
box-shadow:0 1px 3px #ddd;
}

#commentModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:200;
align-items:flex-end;
justify-content:center;
}

#commentModal .modal-box{
background:#fff;
width:100%;
max-width:650px;
max-height:80vh;
border-radius:18px 18px 0 0;
padding:15px;
overflow:auto;
}

.comment{
padding:10px 0;
border-bottom:1px solid #eee;
}

.hidden{
display:none!important;
}

.password-box{
position:relative;
}

.password-box input{
padding-right:50px;
}

.password-box button{
position:absolute;
right:8px;
top:12px;
background:none;
font-size:20px;
}

.file-box{
border:2px dashed #ccc;
border-radius:10px;
padding:20px;
text-align:center;
margin-top:10px;
}

.preview{
width:100%;
max-height:350px;
border-radius:10px;
margin-top:10px;
display:none;
}

.profile-video{
width:100%;
border-radius:10px;
background:#000;
margin-top:8px;
}

</style>

</head>

<body>

<header class="topbar">

<div class="logo">
We Media
</div>

<div id="topUser">
Guest
</div>

</header>


<section id="home" class="page active">

<div id="feed">

<div class="loading">
Loading videos...
</div>

</div>

</section>


<section id="notifications" class="page">

<div class="card">

<h2>Notifications</h2>

</div>

<div id="notificationsList"></div>

</section>


<section id="messages" class="page">

<div class="card">

<h2>Messages</h2>

<input
id="receiverId"
placeholder="Receiver user ID">

<textarea
id="messageInput"
placeholder="Write a message..."></textarea>

<button
class="primary"
onclick="sendMessage()">

Send Message

</button>

</div>

<div id="messagesList"></div>

</section>


<section id="search" class="page">

<div class="card">

<h2>Search</h2>

<input
id="searchInput"
placeholder="Search people..."
oninput="searchUsers()">

</div>

<div id="searchResults"></div>

</section>


<section id="suggestions" class="page">

<div class="card">

<h2>People</h2>

</div>

<div id="suggestionsList"></div>

</section>


<section id="profile" class="page">

<div id="profileContent">

<div class="loading">
Loading profile...
</div>

</div>

</section>


<section id="upload" class="page">

<div class="card">

<h2>Create Video</h2>

<input
id="postTitle"
placeholder="Write a caption...">

<div class="file-box">

<input
id="videoFile"
type="file"
accept="video/*">

<div>
Choose a video
</div>

<video
id="videoPreview"
class="preview"
controls>
</video>

</div>

<button
class="primary"
onclick="uploadPost()">

Upload Video

</button>

</div>

</section>


<section id="login" class="page">

<div class="card">

<h2>Login</h2>

<input
id="loginPhone"
type="tel"
placeholder="Phone number">

<div class="password-box">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
onclick="togglePassword('loginPassword')">
👁
</button>

</div>

<button
class="primary"
onclick="login()">

LOGIN

</button>

<button
class="secondary"
style="width:100%;margin-top:8px"
onclick="showPage('register')">

CREATE ACCOUNT

</button>

</div>

</section>


<section id="register" class="page">

<div class="card">

<h2>Create Account</h2>

<input
id="registerUsername"
placeholder="Username">

<input
id="registerPhone"
type="tel"
placeholder="Phone number">

<input
id="registerEmail"
type="email"
placeholder="Email (optional)">

<div class="password-box">

<input
id="registerPassword"
type="password"
placeholder="Password">

<button
onclick="togglePassword('registerPassword')">
👁
</button>

</div>

<button
class="primary"
onclick="register()">

CREATE ACCOUNT

</button>

<button
class="secondary"
style="width:100%;margin-top:8px"
onclick="showPage('login')">

LOGIN

</button>

</div>

</section>


<div id="commentModal">

<div class="modal-box">

<div class="row-between">

<h3>Comments</h3>

<button
class="secondary"
onclick="closeComments()">
✕
</button>

</div>

<div
id="commentsList"
style="margin-top:12px">
</div>

<textarea
id="commentInput"
placeholder="Write a comment...">
</textarea>

<button
class="primary"
onclick="sendComment()">

Comment

</button>

</div>

</div>


<nav class="nav">

<button onclick="showPage('home')">

<span class="nav-icon">⌂</span>
Home

</button>

<button onclick="showPage('suggestions')">

<span class="nav-icon">👥</span>
People

</button>

<button onclick="requireLogin('upload')">

<span class="nav-icon">＋</span>
Create

</button>

<button onclick="showPage('messages')">

<span class="nav-icon">💬</span>
Messages

</button>

<button onclick="showProfilePage()">

<span class="nav-icon">👤</span>
Profile

</button>

</nav>


<script>

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let selectedVideoId=null;

function $(id){
return document.getElementById(id);
}

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function showPage(page){

document
.querySelectorAll(".page")
.forEach(function(p){
p.classList.remove("active");
});

const target=$(page);

if(!target)return;

target.classList.add("active");

if(page==="home"){
loadFeed();
}

if(page==="messages"){
loadMessages();
}

if(page==="notifications"){
loadNotifications();
}

if(page==="suggestions"){
loadSuggestions();
}

}

function requireLogin(page){

if(!user){

alert("Please login first.");

showPage("login");

return;

}

showPage(page);

}

function showProfilePage(){

if(!user){

showPage("login");

return;

}

showPage("profile");

loadMyProfile();

}

function togglePassword(id){

const input=$(id);

if(!input)return;

input.type=
input.type==="password"
?
"text"
:
"password";

}

async function getProfile(id){

if(!id)return null;

const {data,error}=

await sb
.from("profiles")
.select(
"id,username,email,created_at"
)
.eq("id",id)
.maybeSingle();

if(error){

console.log(
"Profile error:",
error
);

return null;

}

return data;

}

async function register(){

const username=
$("registerUsername")
.value.trim();

const phone=
$("registerPhone")
.value.trim();

const email=
$("registerEmail")
.value.trim();

const password=
$("registerPassword")
.value;

if(!username){

alert("Enter username.");
return;

}

if(!phone){

alert("Enter phone number.");
return;

}

if(
!password ||
password.length<6
){

alert(
"Password must be at least 6 characters."
);

return;

}

const {data,error}=

await sb.auth.signUp({

phone:phone,

password:password,

options:{
data:{
username:username,
email:email
}
}

});

if(error){

alert(error.message);
return;

}

if(data.user){

const {error:profileError}=

await sb
.from("profiles")
.upsert({
id:data.user.id,
username:username,
email:email || null
});

if(profileError){

console.log(
"Profile save error:",
profileError
);

}

}

alert(
"Account created successfully."
);

$("registerPassword").value="";

showPage("login");

}

async function login(){

const phone=
$("loginPhone")
.value.trim();

const password=
$("loginPassword")
.value;

if(!phone || !password){

alert(
"Enter phone number and password."
);

return;

}

const {data,error}=

await sb.auth.signInWithPassword({

phone:phone,
password:password

});

if(error){

alert(error.message);
return;

}

user=data.user;

await updateTopUser();

alert("Welcome back!");

showPage("home");

}

async function updateTopUser(){

const box=$("topUser");

if(!box)return;

if(!user){

box.textContent="Guest";
return;

}

const profile=
await getProfile(user.id);

box.textContent=
profile &&
profile.username
?
"@"+profile.username
:
"User";

}

async function logout(){

await sb.auth.signOut();

user=null;

await updateTopUser();

showPage("home");

}

async function startSession(){

const {data}=

await sb.auth.getSession();

user=
data &&
data.session
?
data.session.user
:
null;

await updateTopUser();

}


/* PROFILE FUNCTIONS */

async function loadMyProfile(){

if(!user){

showPage("login");
return;

}

await openProfile(user.id);

}

async function openProfile(profileId){

if(!profileId){

alert("Profile not found.");
return;

}

const box=$("profileContent");

if(!box)return;

showPage("profile");

box.innerHTML=
'<div class="loading">Loading profile...</div>';

const profile=
await getProfile(profileId);

if(!profile){

box.innerHTML=
'<div class="msg-error">'+
"Profile not found."+
'</div>';

return;

}

const isMe=
String(profile.id)===
String(user && user.id);

const initial=
(profile.username || "U")
.charAt(0)
.toUpperCase();

box.innerHTML=`

<div class="card profile-head">

<div class="profile-avatar">

${escapeHtml(initial)}

</div>

<h2 style="margin-top:10px">

@${escapeHtml(
profile.username || "User"
)}

</h2>

<div style="
color:#777;
margin-top:6px">

${escapeHtml(
profile.email || ""
)}

</div>

${
isMe
?
`
<button
class="primary"
onclick="logout()">
LOGOUT
</button>
`
:
""
}

</div>

<div class="card">

<h3>
Videos
</h3>

<div id="profileVideos"
style="margin-top:10px">

<div class="loading">
Loading videos...
</div>

</div>

</div>

`;

await loadProfileVideos(
profile.id
);

}

async function loadProfileVideos(profileId){

const box=$("profileVideos");

if(!box)return;

const {data,error}=

await sb
.from("videos")
.select("*")
.eq("user_id",profileId)
.order("created_at",{
ascending:false
});

if(error){

box.innerHTML=
'<div class="msg-error">'+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || data.length===0){

box.innerHTML=
'<div class="loading">'+
"No videos yet."+
'</div>';

return;

}

box.innerHTML="";

data.forEach(function(video){

const url=
getVideoUrl(video);

if(!url)return;

const item=
document.createElement("div");

item.innerHTML=`

<video
class="profile-video"
src="${escapeHtml(url)}"
controls
playsinline
preload="metadata">
</video>

<div style="
padding:6px 0 12px;
font-size:13px">

${escapeHtml(
video.title || ""
)}

</div>

`;

box.appendChild(item);

});

}<script>

/* ================================
   VIDEO URL
================================ */

function getVideoUrl(video){

if(!video)return "";

if(video.video_url){

if(
video.video_url.startsWith("http")
){

return video.video_url;

}

return SUPABASE_URL+
"/storage/v1/object/public/Videos/"+
video.video_url;

}

if(video.url){

if(
video.url.startsWith("http")
){

return video.url;

}

return SUPABASE_URL+
"/storage/v1/object/public/Videos/"+
video.url;

}

return "";

}


/* ================================
   LOAD FEED
================================ */

async function loadFeed(){

const box=$("feed");

if(!box)return;

box.innerHTML=
'<div class="loading">Loading videos...</div>';

const {data,error}=

await sb
.from("videos")
.select("*")
.order("created_at",{
ascending:false
});

if(error){

console.log(
"Feed error:",
error
);

box.innerHTML=
'<div class="msg-error">'+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || data.length===0){

box.innerHTML=
'<div class="loading">'+
"No videos yet. Upload the first video."+
'</div>';

return;

}

box.innerHTML="";

data.forEach(function(video){

createVideoCard(
video,
box
);

});

}


/* ================================
   VIDEO CARD
================================ */

function createVideoCard(video,box){

const url=
getVideoUrl(video);

if(!url)return;

const likes=
Number(video.likes)||0;

const views=
Number(video.views)||0;

const liked=
localStorage.getItem(
"wemedia_like_"+video.id
)==="1";

const card=
document.createElement("article");

card.className="video-card";

card.dataset.videoId=
video.id;

card.dataset.likes=
likes;

card.dataset.views=
views;

card.innerHTML=`

<video
src="${escapeHtml(url)}"
controls
playsinline
preload="metadata">
</video>

<div class="video-info">

<div class="row-between">

<div class="username">

@${escapeHtml(
video.username || "User"
)}

</div>

<button
class="secondary"
onclick="openProfile('${escapeHtml(video.user_id || "")}')">

Profile

</button>

</div>

<div class="title">

${escapeHtml(
video.title || ""
)}

</div>

<div class="stats">

${views} views ·

<span class="like-count">

${likes}

</span>

likes

</div>

</div>

<div class="video-actions">

<button
onclick="likePost(${video.id},this)">

${liked ? "❤️" : "♡"} Like

</button>

<button
onclick="commentPost(${video.id})">

💬 Comment

</button>

<button
onclick="sharePost(${video.id})">

↗️ Share

</button>

<button
onclick="whatsappPost(${video.id})">

💬 WhatsApp

</button>

<button
onclick="showSound('${escapeHtml(
video.title || "Original sound"
)}')">

🎵 Sound

</button>

</div>

`;

box.appendChild(card);

const media=
card.querySelector("video");

media.addEventListener(
"play",
function(){

registerView(
video.id,
card
);

},
{
once:true
}
);

}


/* ================================
   VIDEO VIEWS
================================ */

async function registerView(videoId,card){

const current=
Number(card.dataset.views)||0;

const next=
current+1;

card.dataset.views=
next;

const stats=
card.querySelector(".stats");

if(stats){

stats.innerHTML=
next+
' views · '+
'<span class="like-count">'+
(Number(card.dataset.likes)||0)+
'</span> likes';

}

const {error}=

await sb
.from("videos")
.update({
views:next
})
.eq("id",videoId);

if(error){

console.log(
"View error:",
error
);

}

}


/* ================================
   LIKE VIDEO
================================ */

async function likePost(videoId,button){

if(!user){

alert(
"Login to like videos."
);

showPage("login");

return;

}

const key=
"wemedia_like_"+videoId;

const already=
localStorage.getItem(key)==="1";

const card=
button.closest(".video-card");

if(!card)return;

let likes=
Number(card.dataset.likes)||0;

if(already){

likes=Math.max(
0,
likes-1
);

localStorage.removeItem(key);

button.innerHTML=
"♡ Like";

}else{

likes++;

localStorage.setItem(
key,
"1"
);

button.innerHTML=
"❤️ Like";

}

card.dataset.likes=
likes;

const count=
card.querySelector(".like-count");

if(count){

count.textContent=
likes;

}

const {error}=

await sb
.from("videos")
.update({
likes:likes
})
.eq("id",videoId);

if(error){

console.log(
"Like error:",
error
);

alert(error.message);

}

}


/* ================================
   COMMENTS
================================ */

function commentPost(videoId){

if(!user){

alert(
"Login to comment."
);

showPage("login");

return;

}

selectedVideoId=
videoId;

$("commentInput").value="";

$("commentModal").style.display=
"flex";

loadComments(videoId);

}

async function loadComments(videoId){

const box=
$("commentsList");

if(!box)return;

box.innerHTML=
'<div class="loading">'+
"Loading comments..."+
'</div>';

const {data,error}=

await sb
.from("comments")
.select("*")
.eq("video_id",videoId)
.order("created_at",{
ascending:true
});

if(error){

box.innerHTML=
'<div class="msg-error">'+
escapeHtml(error.message)+
'</div>';

return;

}

if(!data || data.length===0){

box.innerHTML=
'<div class="loading">'+
"No comments yet."+
'</div>';

return;

}

box.innerHTML="";

data.forEach(function(comment){

const item=
document.createElement("div");

item.className="comment";

item.innerHTML=`

<div style="
word-break:break-word">

${escapeHtml(
comment.comment
)}

</div>

<div style="
font-size:11px;
color:#888;
margin-top:5px">

${
comment.created_at
?
new Date(
comment.created_at
).toLocaleString()
:
""
}

</div>

`;

box.appendChild(item);

});

}

async function sendComment(){

if(!user){

alert(
"Login to comment."
);

return;

}

if(!selectedVideoId)return;

const input=
$("commentInput");

const comment=
input.value.trim();

if(!comment){

alert(
"Write a comment."
);

return;

}

const {error}=

await sb
.from("comments")
.insert({

video_id:
selectedVideoId,

comment:
comment

});

if(error){

alert(error.message);

return;

}

input.value="";

await loadComments(
selectedVideoId
);

}

function closeComments(){

$("commentModal").style.display=
"none";

selectedVideoId=
null;

}


/* ================================
   SHARE
================================ */

async function sharePost(videoId){

const link=
window.location.origin+
window.location.pathname+
"?video="+
encodeURIComponent(videoId);

if(navigator.share){

try{

await navigator.share({

title:"We Media",

text:"Check this video on We Media",

url:link

});

return;

}catch(error){

console.log(
"Share cancelled."
);

}

}

try{

await navigator.clipboard.writeText(
link
);

alert(
"Video link copied."
);

}catch(error){

prompt(
"Copy this link:",
link

<script>

/* ================================
   UPLOAD / CREATE POST
================================ */

let selectedFile = null;
let cameraStream = null;


/* ================================
   OPEN GALLERY
================================ */

function openGallery(){

if(!requireLogin()) return;

const input = document.createElement("input");

input.type = "file";
input.accept = "video/*,image/*";

input.onchange = function(){

if(!this.files || !this.files[0]) return;

selectedFile = this.files[0];

showPreview(selectedFile);

};

input.click();

}


/* ================================
   OPEN CAMERA
================================ */

async function openCamera(){

if(!requireLogin()) return;

const page = document.getElementById("uploadPage");

if(!page) return;

page.innerHTML = `

<div class="card">

<h2>📷 Camera</h2>

<video
id="cameraVideo"
autoplay
playsinline
muted
style="
width:100%;
border-radius:15px;
background:#000;
max-height:65vh;
object-fit:cover;
">
</video>

<div class="row">

<button
class="primary"
onclick="captureCamera()">
📸 Capture
</button>

<button
class="secondary"
onclick="closeCamera()">
✕ Close
</button>

</div>

<div id="cameraMessage"></div>

</div>

`;

try{

cameraStream =
await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

const video =
document.getElementById("cameraVideo");

if(video){

video.srcObject =
cameraStream;

}

}catch(error){

const msg =
document.getElementById("cameraMessage");

if(msg){

msg.innerHTML =
`<p class="error">
Camera permission denied or unavailable.
</p>`;

}

}

}


/* ================================
   CAPTURE CAMERA
================================ */

function captureCamera(){

const video =
document.getElementById("cameraVideo");

if(!video || !video.srcObject){

alert("Camera is not ready.");

return;

}

const canvas =
document.createElement("canvas");

canvas.width =
video.videoWidth || 720;

canvas.height =
video.videoHeight || 1280;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

canvas.toBlob(function(blob){

if(!blob){

alert("Could not capture video.");

return;

}

selectedFile =
new File(
[blob],
"camera-photo.jpg",
{type:"image/jpeg"}
);

closeCamera();

showPreview(selectedFile);

},"image/jpeg",0.9);

}


/* ================================
   CLOSE CAMERA
================================ */

function closeCamera(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(track => track.stop());

cameraStream = null;

}

showPage("upload");

}


/* ================================
   SHOW PREVIEW
================================ */

function showPreview(file){

const page =
document.getElementById("uploadPage");

if(!page) return;

const isVideo =
file.type.startsWith("video/");

const objectUrl =
URL.createObjectURL(file);

page.innerHTML = `

<div class="card">

<h2>➕ Create Post</h2>

<div id="previewBox">

${
isVideo

? `<video
src="${objectUrl}"
controls
playsinline
style="
width:100%;
border-radius:15px;
max-height:55vh;
background:#000;
">
</video>`

: `<img
src="${objectUrl}"
style="
width:100%;
border-radius:15px;
max-height:55vh;
object-fit:contain;
background:#111;
">`
}

</div>

<input
id="postTitle"
class="input"
type="text"
maxlength="120"
placeholder="Write a caption...">

<div class="row">

<button
class="primary"
onclick="uploadPost()">
🚀 Post
</button>

<button
class="secondary"
onclick="cancelUpload()">
✕ Cancel
</button>

</div>

<div
id="uploadStatus"
class="small">
${formatFileSize(file.size)}
</div>

</div>

`;

}


/* ================================
   FILE SIZE
================================ */

function formatFileSize(bytes){

if(!bytes) return "";

const mb =
bytes / (1024 * 1024);

if(mb < 1){

return (
Math.round(bytes / 1024) +
" KB"
);

}

return (
mb.toFixed(1) +
" MB"
);

}


/* ================================
   CANCEL UPLOAD
================================ */

function cancelUpload(){

selectedFile = null;

showPage("home");

}


/* ================================
   UPLOAD POST
================================ */

async function uploadPost(){

if(!requireLogin()) return;

if(!selectedFile){

alert("Select a photo or video first.");

return;

}

const titleInput =
document.getElementById("postTitle");

const status =
document.getElementById("uploadStatus");

const title =
titleInput
? titleInput.value.trim()
: "";

if(status){

status.innerHTML =
"⏳ Uploading...";

}

try{

const safeName =
selectedFile.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const filePath =
`${user.id}/${Date.now()}_${safeName}`;


/* ================================
   STORAGE UPLOAD
================================ */

const {error:uploadError} =
await sb.storage
.from("Videos")
.upload(
filePath,
selectedFile,
{
upsert:false,
contentType:
selectedFile.type ||
"application/octet-stream"
}
);

if(uploadError){

throw uploadError;

}


/* ================================
   PUBLIC URL
================================ */

const {data:urlData} =
sb.storage
.from("Videos")
.getPublicUrl(filePath);

const publicUrl =
urlData.publicUrl;


/* ================================
   SAVE VIDEO ROW
================================ */

const {error:dbError} =
await sb
.from("videos")
.insert({

title:
title || "New post",

video_url:
publicUrl,

created_at:
new Date().toISOString(),

likes:0,

views:0,

file_name:
selectedFile.name,

url:
publicUrl,

user_id:
user.id,

username:
user.username || "User"

});

if(dbError){

/* Remove uploaded file if database
   insert fails */

await sb.storage
.from("Videos")
.remove([filePath]);

throw dbError;

}


/* ================================
   SUCCESS
================================ */

selectedFile = null;

alert("✅ Post uploaded successfully!");

showPage("home");

}catch(error){

console.error(error);

if(status){

status.innerHTML =
`❌ Upload failed: ${
escapeHtml(error.message || "Unknown error")
}`;

}else{

alert(
"Upload failed: " +
(error.message || "Unknown error")
);

}

}

}


/* ================================
   UPLOAD PAGE
================================ */

function openUpload(){

if(!requireLogin()) return;

selectedFile = null;

showPage("upload");

const page =
document.getElementById("uploadPage");

if(!page) return;

page.innerHTML = `

<div class="card">

<h2>➕ Create Post</h2>

<p class="muted">
Share a photo or video with We Media.
</p>

<div class="upload-buttons">

<button
class="primary"
onclick="openGallery()">
🖼️ Gallery
</button>

<button
class="primary"
onclick="openCamera()">
📷 Camera
</button>

</div>

<div class="small"
style="margin-top:12px">

Photos and videos are supported.

</div>

</div>

`;

}


/* ================================
   PREVIEW POST
================================ */

function previewPost(){

showPreview(selectedFile);

return;

openUpload();

}

function handleSelectedFile(input){

input.files[0];

   CLEAN CAMERA WHEN LEAVING PAGE
================================ */

window.addEventListener(

cameraStream

track.stop()

<script>

/* ================================
   MESSAGES
================================ */

async function loadMessages(){

const box =
document.getElementById("messagesList");

if(!box) return;

if(!user){

box.innerHTML =
`<p class="muted">Login to use messages.</p>`;

return;

}

box.innerHTML =
`<p class="muted">Loading messages...</p>`;

const {data,error} =
await sb
.from("messages")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
)
.order("created_at",{ascending:true});

if(error){

box.innerHTML =
`<p class="error">${escapeHtml(error.message)}</p>`;

return;

}

if(!data || !data.length){

box.innerHTML =
`<p class="muted">No messages yet.</p>`;

return;

}

box.innerHTML =
data.map(m=>{

const mine =
m.sender_id === user.id;

const body =
m.message || m.text || "";

return `

<div class="message ${
mine ? "mine" : "theirs"
}">

${escapeHtml(body)}

<div class="message-time">
${new Date(m.created_at).toLocaleString()}
</div>

</div>

`;

}).join("");

box.scrollTop =
box.scrollHeight;

}


/* ================================
   SEND MESSAGE
================================ */

async function sendMessage(){

if(!requireLogin()) return;

const input =
document.getElementById("messageInput");

const receiver =
document.getElementById("receiverInput");

if(!input || !receiver) return;

const message =
input.value.trim();

const receiverId =
receiver.value.trim();

if(!receiverId){

alert("Enter receiver user ID.");

return;

}

if(!message){

alert("Write a message first.");

return;

}

const {error} =
await sb
.from("messages")
.insert({

sender_id:user.id,

receiver_id:receiverId,

message:message,

text:message,

is_read:false,

created_at:
new Date().toISOString()

});

if(error){

alert(
"Message failed: " +
error.message
);

return;

}

input.value="";

await loadMessages();

}

);
