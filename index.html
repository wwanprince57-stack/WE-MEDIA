<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>We Media</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  padding-bottom:75px;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#000;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#00e5ff;
}

button{
  border:0;
  cursor:pointer;
}

.headerBtn{
  background:#00e5ff;
  color:#000;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.videoCard{
  width:100%;
  background:#050505;
  margin-bottom:18px;
}

.video{
  width:100%;
  height:430px;
  object-fit:cover;
  background:#111;
  display:block;
}

.videoInfo{
  padding:12px 15px;
}

.username{
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  color:#ddd;
  font-size:14px;
}

.actions{
  display:flex;
  gap:18px;
  padding:10px 15px 14px;
}

.action{
  background:none;
  color:#fff;
  font-size:15px;
}

.action.liked{
  color:#ff3158;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#aaa;
}

.uploadBox{
  margin:25px 15px;
  padding:30px 20px;
  border:1px dashed #555;
  border-radius:15px;
  text-align:center;
}

.uploadBox input{
  margin:20px 0;
  width:100%;
}

.uploadBtn{
  background:#00e5ff;
  padding:12px 25px;
  border-radius:25px;
  font-weight:bold;
}

.profile{
  padding:30px 20px;
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#00e5ff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:10px auto 15px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#080808;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav button{
  background:none;
  color:#aaa;
  font-size:12px;
}

.nav button.active{
  color:#00e5ff;
}

.navIcon{
  display:block;
  font-size:23px;
  margin-bottom:3px;
}

#fileName{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">We <span>Media</span></div>
  <button class="headerBtn" onclick="showPage('upload')">Upload</button>
</header>

<!-- HOME -->
<section id="home" class="page active">

  <div class="videoCard">

    <video class="video" controls loop playsinline
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    </video>

    <div class="videoInfo">
      <div class="username">@wemedia</div>
      <div class="caption">Welcome to We Media 🎬</div>
    </div>

    <div class="actions">
      <button class="action" onclick="like(this)">❤️ Like</button>
      <button class="action" onclick="comment()">💬 Comment</button>
      <button class="action" onclick="shareVideo()">↗ Share</button>
    </div>

  </div>


  <div class="videoCard">

    <video class="video" controls loop playsinline
      src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>

    <div class="videoInfo">
      <div class="username">@wemedia</div>
      <div class="caption">Watch and share videos on We Media 🔥</div>
    </div>

    <div class="actions">
      <button class="action" onclick="like(this)">❤️ Like</button>
      <button class="action" onclick="comment()">💬 Comment</button>
      <button class="action" onclick="shareVideo()">↗ Share</button>
    </div>

  </div>

</section>


<!-- UPLOAD -->
<section id="upload" class="page">

  <div class="uploadBox">

    <h2>Upload Video 🎬</h2>

    <p style="margin-top:10px;color:#aaa;">
      Choose a video from your phone
    </p>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
      onchange="selectVideo()"
    >

    <div id="fileName"></div>

    <br>

    <button class="uploadBtn" onclick="previewVideo()">
      Preview Video
    </button>

    <div id="preview" style="margin-top:20px;"></div>

  </div>

</section>


<!-- PROFILE -->
<section id="profile" class="page">

  <div class="profile">

    <div class="avatar">W</div>

    <h2>We Media User</h2>

    <p style="color:#aaa;margin-top:8px;">
      Welcome to your profile
    </p>

    <div style="
      display:flex;
      justify-content:space-around;
      margin-top:35px;
      padding:20px 0;
      border-top:1px solid #222;
      border-bottom:1px solid #222;
    ">

      <div>
        <b>0</b><br>
        <small>Videos</small>
      </div>

      <div>
        <b>0</b><br>
        <small>Followers</small>
      </div>

      <div>
        <b>0</b><br>
        <small>Following</small>
      </div>

    </div>

  </div>

</section>


<!-- NAVIGATION -->
<nav class="nav">

  <button class="active" onclick="showPage('home',this)">
    <span class="navIcon">🏠</span>
    Home
  </button>

  <button onclick="showPage('upload',this)">
    <span class="navIcon">➕</span>
    Upload
  </button>

  <button onclick="showPage('profile',this)">
    <span class="navIcon">👤</span>
    Profile
  </button>

</nav>


<script>

function showPage(page,button){

  document.querySelectorAll('.page').forEach(function(p){
    p.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');

  document.querySelectorAll('.nav button').forEach(function(b){
    b.classList.remove('active');
  });

  if(button){
    button.classList.add('active');
  }
}

function like(button){

  button.classList.toggle('liked');

  if(button.classList.contains('liked')){
    button.innerHTML="❤️ Liked";
  }else{
    button.innerHTML="❤️ Like";
  }
}

function comment(){

  let message=prompt("Write your comment:");

  if(message){
    alert("Comment added: "+message);
  }
}

function shareVideo(){

  if(navigator.share){

    navigator.share({
      title:"We Media",
      text:"Watch this video on We Media"
    });

  }else{

    alert("Share is not available on this browser.");

  }
}

function selectVideo(){

  let file=document.getElementById("videoFile").files[0];

  if(file){

    document.getElementById("fileName").innerText=
      "Selected: "+file.name;

  }

}

function previewVideo(){

  let file=document.getElementById("videoFile").files[0];

  if(!file){

    alert("Choose a video first.");
    return;

  }

  let url=URL.createObjectURL(file);

  document.getElementById("preview").innerHTML=`

    <video
      controls
      autoplay
      loop
      playsinline
      style="width:100%;border-radius:12px;"
      src="${url}">
    </video>

    <p style="color:#00e5ff;margin-top:10px;">
      Video preview ready 🎬
    </p>

  `;

}

</script>

</body>
</html>
