const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user = null;
let selectedChat = null;
let currentCommentVideo = null;
let postEffect = "none";


/* =========================
   SHORT SELECTOR
========================= */

function $(id){
return document.getElementById(id);
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   PAGE SYSTEM
========================= */

function showPage(name){

document
.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

const page =
$(name+"Page");

if(page){
page.classList.add("active");
}

document
.querySelectorAll(".nav")
.forEach(nav=>{
nav.classList.remove("active");
});

const nav =
$(name+"Nav");

if(nav){
nav.classList.add("active");
}

window.scrollTo(0,0);

if(name==="home"){
loadVideos();
}

if(name==="profile"){
loadProfile();
}

if(name==="suggestions"){
loadSuggestions();
}

if(name==="notifications"){
loadNotifications();
}

if(name==="messages"){
loadChatUsers();
}

}


/* =========================
   REGISTER
========================= */

async function register(){

const name =
$("regName").value.trim();

const email =
$("regEmail").value.trim();

const phone =
$("regPhone").value.trim();

const pass =
$("regPass").value;

if(!name){

alert("Enter your name");

return;
}

if(!email && !phone){

alert("Enter email or phone number");

return;
}

if(pass.length < 6){

alert(
"Password must be at least 6 characters"
);

return;
}


/* EMAIL SIGNUP */

if(email){

const {data,error} =
await sb.auth.signUp({

email:email,

password:pass,

options:{
data:{
username:name,
full_name:name,
phone:phone || ""
}
}

});

if(error){

alert("❌ "+error.message);

return;
}

if(data?.user){

await sb
.from("profiles")
.upsert({

id:data.user.id,

username:name,

email:email,

phone:phone || null

});

user=data.user;

if(data.session){

showPage("home");

}else{

alert(
"✅ Account created. Check your email if confirmation is required."
);

showPage("login");

}

}

return;

}


/* PHONE */

alert(
"Phone signup needs Phone Auth enabled in Supabase."
);

}


/* =========================
   LOGIN
========================= */

async function login(){

const identity =
$("loginId").value.trim();

const pass =
$("loginPass").value;

if(!identity){

alert(
"Enter email or phone number"
);

return;
}

if(pass.length < 6){

alert(
"Password must be 6+ characters"
);

return;
}

let result;

if(identity.includes("@")){

result =
await sb.auth.signInWithPassword({

email:identity,

password:pass

});

}else{

result =
await sb.auth.signInWithPassword({

phone:identity,

password:pass

});

}

if(result.error){

alert(
"❌ "+result.error.message
);

return;
}

user =
result.data?.user || null;

showPage("home");

}

   LOGOUT

/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

const box =
$("feed");

if(!box)return;

box.innerHTML =
'<div class="box muted">Loading videos...</div>';

try{

const {data,error} =
await sb
.from("videos")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error)throw error;

if(!data || data.length===0){

box.innerHTML =
'<div class="box muted">No posts yet. Be the first to post.</div>';

return;

}


/* LOAD PROFILES ONCE */

let profileMap = {};

const ids =
[
...new Set(
data
.map(v=>v.user_id)
.filter(Boolean)
)
];

if(ids.length){

try{

const {data:profiles} =
await sb
.from("profiles")
.select("id,username,avatar_url")
.in("id",ids);

(profiles || [])
.forEach(profile=>{

profileMap[profile.id]=profile;

});

}catch(e){

console.log(
"Profile loading skipped:",
e
);

}

}

box.innerHTML="";

for(const video of data){

createPostCard(
video,
box,
profileMap[video.user_id] || null
);

}

}catch(error){

console.log(
"VIDEOS ERROR:",
error
);

box.innerHTML =
'<div class="box">❌ Failed to load videos</div>';

}

}


/* =========================
   VIDEO CARD
========================= */

function createPostCard(
v,
box,
profile
){

const card =
document.createElement("div");

card.className =
"video-card";

const url =
v.video_url ||
v.url ||
"";

if(!url)return;


/* MEDIA */

const isImage =
/\.(jpg|jpeg|png|gif|webp|avif)(\?|$)/i
.test(url);

let media;

if(isImage){

media =
document.createElement("img");

media.src=url;

media.className="media";

}else{

media =
document.createElement("video");

media.src=url;

media.className="media";

media.controls=true;

media.loop=true;

media.playsInline=true;

media.preload="metadata";

}

card.appendChild(media);


/* USER */

const username =
profile?.username ||
v.username ||
"User";


/* INFO */

const info =
document.createElement("div");

info.className =
"video-info";

info.innerHTML =

"<div class='video-user'>@"+
escapeHTML(username)+
"</div>"+

"<div class='video-title'>"+
escapeHTML(v.title || "")+
"</div>";

card.appendChild(info);


/* ACTIONS */

const actions =
document.createElement("div");

actions.className =
"video-actions";

actions.innerHTML = `

<button
class="action"
type="button"
onclick="openProfile('${v.user_id || ""}')">

<span class="action-icon">
👤
</span>

</button>


<button
class="action"
type="button"
onclick="likePost('${v.id}',this)">

<span class="action-icon">
🤍
</span>

</button>


<button
class="action"
type="button"
onclick="commentPost('${v.id}')">

<span class="action-icon">
💬
</span>

</button>


<button
class="action"
type="button"
onclick="sharePost('${v.id}')">

<span class="action-icon">
📤
</span>

</button>


<button
class="action"
type="button"
onclick="whatsappShare('${encodeURIComponent(url)}')">

<span class="action-icon">
🟢
</span>

</button>

`;

card.appendChild(actions);


/* SOUND */

const sound =
document.createElement("div");

sound.className =
"sound-used";

sound.textContent =
"🎵 Original sound · @"+
username;

card.appendChild(sound);

box.appendChild(card);

}


/* =========================
   LIKE POST
========================= */

async function likePost(
videoId,
button
){

if(!user){

alert("Login first");

showPage("login");

return;

}

const icon =
button.querySelector(
".action-icon"
);

if(!icon)return;

try{

const {data:existing,error:checkError} =
await sb
.from("likes")
.select("video_id")
.eq("video_id",videoId)
.eq("user_id",user.id)
.maybeSingle();

if(checkError){

console.log(checkError);

alert(
"❌ "+checkError.message
);

return;

}


/* UNLIKE */

if(existing){

const {error} =
await sb
.from("likes")
.delete()
.eq("video_id",videoId)
.eq("user_id",user.id);

if(error)throw error;

icon.textContent="🤍";

return;

}


/* LIKE */

const {error} =
await sb
.from("likes")
.insert({

video_id:videoId,

user_id:user.id

});

if(error)throw error;

icon.textContent="❤️";

}catch(error){

console.log(error);

alert(
"❌ Like failed: "+
error.message
);

}

}


/* =========================
   LIKE COUNT
========================= */

async function getLikeCount(videoId){

const {count,error} =
await sb
.from("likes")
.select(
"*",
{
count:"exact",
head:true
}
)
.eq(
"video_id",
videoId
);

if(error)return 0;

return count || 0;

}


/* =========================
   SHARE
========================= */

async function sharePost(videoId){

const url =
window.location.origin+
window.location.pathname+
"?video="+
encodeURIComponent(videoId);

try{

if(
navigator.share
){

await navigator.share({

title:"We Media",

text:
"Check this post on We Media",

url:url

});

}else{

await navigator.clipboard.writeText(url);

alert(
"✅ Post link copied"
);

}

}catch(error){

console.log(error);

}

}


/* =========================
   WHATSAPP
========================= */

function whatsappShare(
videoUrl
){

const url =
decodeURIComponent(
videoUrl
);

const text =
"Check this post on We Media 👇\n"+
url;

const wa =
"https://wa.me/?text="+
encodeURIComponent(text);

window.location.href=wa;

}

currentCommentVideo =

$("commentModal")

/* =========================
   FILE PREVIEW
========================= */

function showPreview(file){

const preview=
$("effectPreview");

if(!preview)return;

preview.innerHTML="";

preview.style.display=
"block";

const url=
URL.createObjectURL(file);

let media;

if(
file.type.startsWith("image/")
){

media=
document.createElement("img");

}else if(
file.type.startsWith("video/")
){

media=
document.createElement("video");

media.controls=true;
media.autoplay=true;
media.loop=true;
media.muted=true;
media.playsInline=true;

}else{

preview.style.display=
"none";

return;

}

media.src=url;

media.style.width="100%";
media.style.height="100%";
media.style.objectFit="cover";
media.style.filter=
postEffect;

preview.appendChild(media);

}

async function uploadPost(){

if(!user){

alert(
"Please login first"
);

showPage("login");

return;

}

const title=
$("postTitle")
.value
.trim();

const file=
$("postFile")
.files[0];

if(!file){

alert(
"Choose a photo or video"
);

return;

}

if(
file.size >
50*1024*1024
){

alert(
"❌ File is bigger than 50 MB"
);

return;

}

$("uploadMsg").textContent=
"Uploading...";

try{

const ext=
file.name
.split(".")
.pop()
.toLowerCase();

const path=
user.id+
"/"+
Date.now()+
"."+ext;

const {
error:uploadError
}=
await sb.storage
.from("Videos")
.upload(
path,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(uploadError){

throw uploadError;

}

const {
data:urlData
}=
sb.storage
.from("Videos")
.getPublicUrl(
path
);

const publicUrl=
urlData.publicUrl;

const {
error:dbError
}=
await sb
.from("videos")
.insert({

user_id:user.id,

title:
title||
"New post",

video_url:
publicUrl

});

if(dbError){

throw dbError;

}

$("postTitle").value="";

$("postFile").value="";

$("uploadMsg").textContent=
"✅ Posted successfully!";

postEffect="none";

const preview=
$("effectPreview");

if(preview){

preview.innerHTML="";

preview.style.display=
"none";

}

showPage("home");

await loadVideos();

}catch(error){

console.error(error);

$("uploadMsg").textContent=
"❌ "+error.message;

}

}

"✅ Selected: "+
file.name;

showPreview(file);

});

}


/* =========================
   PAGE START
========================= */

document.addEventListener(
"DOMContentLoaded",
async function(){

setupSearch();

setupFileInput();

addEffects();

await checkUser();

await loadVideos();

if(user){

await loadProfile();

await loadSuggestions();

await loadNotifications();

await loadChatUsers();

}

console.log(
"✅ We Media is ready"
);

});


/* =========================
   AUTH REFRESH
========================= */

sb.auth.onAuthStateChange(
function(event,session){

user=
session?.user||null;

});


/* =========================
   PAUSE VIDEOS WHEN HIDDEN
========================= */

document.addEventListener(
"visibilitychange",
function(){

if(document.hidden){

document
.querySelectorAll("video")
.forEach(video=>{

if(!video.paused){

video.pause();

}

});

}

});


/* =========================
   VIDEO LINK OPEN
========================= */

async function openVideoFromLink(){

const params=
new URLSearchParams(
window.location.search
);

const videoId=
params.get("video");

if(!videoId)return;

await loadVideos();

const cards=
document.querySelectorAll(
".video-card"
);

cards.forEach(card=>{

if(
card.innerHTML
.includes(videoId)
){

card.scrollIntoView({
behavior:"smooth"
});

}

});

}

</script>
