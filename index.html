<body>

<header>

</header>

➕<br>Following
</button>

</button>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const BUCKET="Videos";


/* =========================
   ACCOUNT SYSTEM
========================= */

function getUsers(){

return JSON.parse(
localStorage.getItem("weMediaUsers") || "[]"
);

}


function saveUsers(users){

localStorage.setItem(
"weMediaUsers",
JSON.stringify(users)
);

}


function getCurrentUser(){

return JSON.parse(
localStorage.getItem("weMediaCurrentUser") || "null"
);

}


function setCurrentUser(user){

localStorage.setItem(
"weMediaCurrentUser",
JSON.stringify(user)
);

}


function showAuth(type){

hideAll();

document.getElementById("authBox").style.display="block";

const title=document.getElementById("authTitle");
const button=document.getElementById("authButton");
const switchBox=document.getElementById("authSwitch");
const username=document.getElementById("username");

document.getElementById("authStatus").textContent="";

if(type==="login"){

title.textContent="🔐 Login";

button.textContent="Login";

username.style.display="none";

switchBox.innerHTML=
'Don\'t have an account? '+
'<span onclick="showAuth(\'register\')">Create Account</span>';

}else{

title.textContent="👤 Create Account";

button.textContent="Create Account";

username.style.display="block";

switchBox.innerHTML=
'Already have an account? '+
'<span onclick="showAuth(\'login\')">Login</span>';

}

window.authMode=type;

}


function submitAuth(){

const username=
document.getElementById("username").value.trim();

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const status=
document.getElementById("authStatus");

const users=getUsers();

if(window.authMode==="register"){

if(!username || !email || !password){

status.textContent=
"❌ Fill in all fields.";

return;

}

if(password.length<6){

status.textContent=
"❌ Password must be at least 6 characters.";

return;

}

const exists=users.find(
u=>u.email.toLowerCase()===email.toLowerCase()
);

if(exists){

status.textContent=
"❌ Account already exists.";

return;

}

const newUser={
id:Date.now(),
username:username,
email:email,
password:password,
following:[],
notifications:[]
};

users.push(newUser);

saveUsers(users);

setCurrentUser({
id:newUser.id,
username:newUser.username,
email:newUser.email
});

status.textContent=
"✅ Account created successfully!";

setTimeout(()=>{

showProfile();
updateProfile();

},700);

}else{

if(!email || !password){

status.textContent=
"❌ Enter email and password.";

return;

}

const user=users.find(
u=>
u.email.toLowerCase()===email.toLowerCase()
&&
u.password===password
);

if(!user){

status.textContent=
"❌ Wrong email or password.";

return;

}

setCurrentUser({
id:user.id,
username:user.username,
email:user.email
});

status.textContent=
"✅ Login successful!";

setTimeout(()=>{

showProfile();
updateProfile();

},700);

}

}


function logout(){

localStorage.removeItem(
"weMediaCurrentUser"
);

updateProfile();

showHome();

}


function updateProfile(){

const user=getCurrentUser();

const name=
document.getElementById("profileName");

const email=
document.getElementById("profileEmail");

const logoutButton=
document.getElementById("logoutBtn");

if(user){

name.textContent=
"@"+user.username;

email.textContent=
user.email;

logoutButton.style.display=
"inline-block";

}else{

name.textContent=
"Guest";

email.textContent=
"Not logged in";

logoutButton.style.display=
"none";

}

}


/* =========================
   FOLLOWING SYSTEM
========================= */

function getFollowing(){

const user=getCurrentUser();

if(!user)return [];

const data=
JSON.parse(
localStorage.getItem(
"weMediaFollowing_"+user.id
) || "[]"
);

return data;

}


function saveFollowing(list){

const user=getCurrentUser();

if(!user)return;

localStorage.setItem(
"weMediaFollowing_"+user.id,
JSON.stringify(list)
);

}


function showFollowing(){

hideAll();

const box=
document.getElementById("followingBox");

box.style.display="block";

const list=
document.getElementById("followingList");

const user=getCurrentUser();

if(!user){

list.innerHTML=
'<div class="empty">Login first to see Following.</div>';

return;

}

const following=getFollowing();

if(following.length===0){

list.innerHTML=
'<div class="empty">'+
'You are not following anyone yet.<br><br>'+
'Following users will appear here.'+
'</div>';

return;

}

list.innerHTML="";

following.forEach(name=>{

const item=document.createElement("div");

item.className="user-item";

item.innerHTML=
"<span>👤 @"+escapeHTML(name)+"</span>"+
'<button onclick="unfollowUser(\''+
escapeJS(name)+
'\')">Following ✓</button>';

list.appendChild(item);

});

}


function followUser(username){

const user=getCurrentUser();

if(!user){

showAuth("login");

return;

}

let following=getFollowing();

if(following.includes(username)){

return;

}

following.push(username);

saveFollowing(following);

addNotification(
"@"+username+" is now in your Following list."
);

showFollowing();

}


function unfollowUser(username){

let following=getFollowing();

following=
following.filter(
name=>name!==username
);

saveFollowing(following);

showFollowing();

}


/* =========================
   NOTIFICATIONS
========================= */

function addNotification(message){

const user=getCurrentUser();

if(!user)return;

let notifications=
JSON.parse(
localStorage.getItem(
"weMediaNotifications_"+user.id
) || "[]"
);

notifications.unshift({

id:Date.now(),

message:message,

time:new Date().toLocaleString()

});

localStorage.setItem(
"weMediaNotifications_"+user.id,
JSON.stringify(notifications)
);

}


function showNotifications(){

hideAll();

const box=
document.getElementById("notificationBox");

box.style.display="block";

const list=
document.getElementById("notificationList");

const user=getCurrentUser();

if(!user){

list.innerHTML=
'<div class="empty">Login first to see notifications.</div>';

return;

}

const notifications=
JSON.parse(
localStorage.getItem(
"weMediaNotifications_"+user.id
) || "[]"
);

if(notifications.length===0){

list.innerHTML=
'<div class="empty">🔔 No notifications yet.</div>';

return;

}

list.innerHTML="";

notifications.forEach(item=>{

const div=
document.createElement("div");

div.className="notification";

div.innerHTML=
"🔔 "+escapeHTML(item.message)+
'<div class="small">'+
escapeHTML(item.time)+
"</div>";

list.appendChild(div);

});

}


/* =========================
   HOME VIDEOS
========================= */

async function loadVideos(){

const feed=document.getElementById("feed");

feed.innerHTML=
'<div class="empty">Loading videos...</div>';

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/videos?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

if(!response.ok)
throw new Error(await response.text());

const videos=await response.json();

if(videos.length===0){

feed.innerHTML=
'<div class="empty">'+
'No videos yet 🎬<br>'+
'Upload the first video!'+
'</div>';

return;

}

feed.innerHTML="";

videos.forEach(videoData=>{

createVideoCard(videoData);

});

}catch(error){

console.error(error);

feed.innerHTML=
'<div class="empty">'+
'❌ Could not load videos.'+
'</div>';

}

}


/* =========================
   VIDEO CARD
========================= */

function createVideoCard(videoData){

const feed=document.getElementById("feed");

const card=document.createElement("div");

card.className="video-card";

const video=document.createElement("video");

video.controls=true;

video.playsInline=true;

video.preload="metadata";

video.src=videoData.video_url;

let viewCount=
Number(videoData.views||0);

let likeCount=
Number(videoData.likes||0);

const info=document.createElement("div");

info.className="info";

const title=
document.createElement("div");

title.className="title";

title.textContent=
videoData.title||
"We Media Video";

const stats=
document.createElement("div");

stats.className="stats";

const views=
document.createElement("span");

views.textContent=
"👁️ "+viewCount+" views";

const likes=
document.createElement("span");

likes.textContent=
"❤️ "+likeCount+" likes";

stats.appendChild(views);

stats.appendChild(likes);

const actions=
document.createElement("div");

actions.className="actions";


/* LIKE */

const likeButton=
document.createElement("button");

likeButton.className="like-btn";

likeButton.textContent="❤️ Like";

let liked=false;

likeButton.onclick=async()=>{

if(liked)return;

liked=true;

likeCount++;

likes.textContent=
"❤️ "+likeCount+" likes";

likeButton.textContent=
"❤️ Liked";

likeButton.classList.add("liked");

try{

await fetch(
SUPABASE_URL+
"/rest/v1/videos?id=eq."+
videoData.id,
{
method:"PATCH",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
likes:likeCount
})
}
);

}catch(error){

console.error(error);

}

};


/* COMMENT */

const commentButton=
document.createElement("button");

commentButton.textContent=
"💬 Comment";

const commentsBox=
document.createElement("div");

commentsBox.className="comments";

const commentInput=
document.createElement("input");

commentInput.className=
"comment-input";

commentInput.placeholder=
"Write a comment...";

const commentSend=
document.createElement("button");

commentSend.textContent="Send";

const commentRow=
document.createElement("div");

commentRow.className="comment-input";

commentRow.appendChild(commentInput);

commentRow.appendChild(commentSend);

const commentList=
document.createElement("div");

commentList.className=
"comment-list";

commentsBox.appendChild(commentRow);

commentsBox.appendChild(commentList);

commentsBox.style.display="none";

commentButton.onclick=async()=>{

if(commentsBox.style.display==="none"){

commentsBox.style.display="block";

await loadComments(
videoData.id,
commentList
);

}else{

commentsBox.style.display="none";

}

};


commentSend.onclick=async()=>{

const text=
commentInput.value.trim();

if(!text)return;

commentSend.disabled=true;

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/comments",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
video_id:videoData.id,
comment:text
})
});

if(!response.ok)
throw new Error(
await response.text()
);

commentInput.value="";

await loadComments(
videoData.id,
commentList
);

}catch(error){

alert(
"Comment failed: "+
error.message
);

}finally{

commentSend.disabled=false;

}

};


/* FOLLOW BUTTON */

const followButton=
document.createElement("button");

followButton.textContent=
"➕ Follow";

followButton.onclick=()=>{

const user=getCurrentUser();

if(!user){

showAuth("login");

return;

}

const username=
videoData.username||
"creator";

if(username==="creator"){

alert(
"This video has no creator username yet."
);

return;

}

followUser(username);

followButton.textContent=
"✓ Following";

followButton.disabled=true;

};


/* ACTIONS */

actions.appendChild(likeButton);

actions.appendChild(commentButton);

actions.appendChild(followButton);

info.appendChild(title);

info.appendChild(stats);

info.appendChild(actions);

info.appendChild(commentsBox);

card.appendChild(video);

card.appendChild(info);

feed.appendChild(card);


/* VIEWS */

let countedView=false;

video.addEventListener(
"play",
async()=>{

if(countedView)return;

countedView=true;

viewCount++;

views.textContent=
"👁️ "+viewCount+" views";

try{

await fetch(
SUPABASE_URL+
"/rest/v1/videos?id=eq."+
videoData.id,
{
method:"PATCH",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
views:viewCount
})
}
);

}catch(error){

console.error(error);

}

});

}


/* =========================
   COMMENTS
========================= */

async function loadComments(
videoId,
container
){

container.innerHTML=
'<div style="color:#aaa">'+
'Loading comments...'+
'</div>';

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/comments?video_id=eq."+
videoId+
"&select=*&order=created_at.asc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

if(!response.ok)
throw new Error(
await response.text()
);

const comments=
await response.json();

container.innerHTML="";

if(comments.length===0){

container.innerHTML=
'<div style="color:#777">'+
'No comments yet.'+
'</div>';

return;

}

comments.forEach(item=>{

const div=
document.createElement("div");

div.className="comment";

div.textContent=
"💬 "+item.comment;

container.appendChild(div);

});

}catch(error){

container.innerHTML=
'<div style="color:#f66">'+
'Could not load comments.'+
'</div>';

console.error(error);

}

}


/* =========================
   UPLOAD
========================= */

async function uploadVideo(){

const title=
document.getElementById("videoTitle")
.value.trim();

const fileInput=
document.getElementById("videoFile");

const status=
document.getElementById("status");

const file=
fileInput.files[0];

if(!file){

status.textContent=
"Choose a video first.";

return;

}

status.textContent=
"Uploading...";

try{

const safeName=
Date.now()+"_"+
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const uploadURL=
SUPABASE_URL+
"/storage/v1/object/"+
BUCKET+"/"+safeName;

const uploadResponse=
await fetch(
uploadURL,
{
method:"POST",
headers:{
"Authorization":
"Bearer "+SUPABASE_KEY,
"apikey":SUPABASE_KEY,
"Content-Type":
file.type||"video/mp4"
},
body:file
}
);

if(!uploadResponse.ok)
throw new Error(
await uploadResponse.text()
);

const publicURL=
SUPABASE_URL+
"/storage/v1/object/public/"+
BUCKET+"/"+safeName;

const currentUser=
getCurrentUser();

const dbResponse=
await fetch(
SUPABASE_URL+
"/rest/v1/videos",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+SUPABASE_KEY,
"Content-Type":
"application/json",
"Prefer":
"return=minimal"
},
body:JSON.stringify({

title:
title||"We Media Video",

video_url:
publicURL,

likes:0,

views:0,

username:
currentUser?
currentUser.username:
"creator"

})
}
);

if(!dbResponse.ok)
throw new Error(
await dbResponse.text()
);

status.textContent=
"✅ Video uploaded successfully!";

document.getElementById(
"videoTitle"
).value="";

fileInput.value="";

setTimeout(()=>{

showHome();

loadVideos();

},1000);

}catch(error){

console.error(error);

status.textContent=
"❌ Upload failed: "+
error.message;

}

}


/* ==
