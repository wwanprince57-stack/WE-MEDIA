<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
font-family:Arial,sans-serif;
margin:0;
padding:0;
}

body{
background:#000;
color:#fff;
padding-bottom:70px;
}

header{
height:55px;
position:fixed;
top:0;
left:0;
right:0;
background:#000;
border-bottom:1px solid #222;
padding:15px;
z-index:10;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.logo span{
color:#09f;
}

header button{
background:#111;
color:#fff;
border:1px solid #333;
border-radius:20px;
padding:6px 12px;
margin-left:5px;
}

main{
padding-top:55px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.auth{
min-height:90vh;
display:grid;
place-items:center;
padding:20px;
}

.box{
width:100%;
max-width:400px;
text-align:center;
}

p{
color:#888;
margin:10px 0 20px;
}

.input,
textarea{
width:100%;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:10px;
padding:13px;
margin:6px 0;
}

.primary{
width:100%;
background:#08f;
color:#fff;
border:0;
border-radius:25px;
padding:13px;
margin:8px 0;
font-weight:bold;
}

.switch{
color:#888;
margin-top:15px;
}

.switch button{
background:none;
border:0;
color:#09f;
}

.msg{
text-align:center;
padding:10px;
color:#09f;
}

.search{
padding:12px 15px;
position:sticky;
top:55px;
background:#000;
z-index:2;
}

.search input{
width:100%;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:25px;
padding:13px;
}

.results{
padding:0 15px;
}

.result{
padding:14px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

.result button{
background:#08f;
color:#fff;
border:0;
border-radius:20px;
padding:8px 13px;
}

.video-card{
border-bottom:1px solid #222;
padding-bottom:15px;
margin-bottom:20px;
}

video{
width:100%;
max-height:650px;
background:#000;
}

.info{
padding:10px;
}

.user,
.date{
color:#888;
font-size:12px;
margin:5px 0;
}

.user.clickable{
color:#09f;
cursor:pointer;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px;
}

.actions button{
background:#151515;
color:#fff;
border:1px solid #333;
border-radius:20px;
padding:8px 12px;
}

.liked{
color:#ff3970!important;
}

.follow{
color:#09f!important;
}

.comments{
display:none;
margin-top:10px;
}

.comment{
padding:8px 0;
border-bottom:1px solid #222;
}

.upload,
.profile,
.notice,
.public-profile{
padding:25px 20px;
max-width:550px;
margin:auto;
}

.avatar{
text-align:center;
font-size:55px;
margin:20px;
}

.stats{
text-align:center;
margin:25px;
display:flex;
justify-content:space-around;
}

.stats b{
display:block;
font-size:21px;
}

.stats small{
color:#888;
}

.profile-btn{
background:#08f;
color:#fff;
border:0;
border-radius:25px;
padding:11px 25px;
font-weight:bold;
}

.back{
background:#151515;
color:#fff;
border:1px solid #333;
border-radius:20px;
padding:8px 15px;
margin-bottom:15px;
}

nav{
display:none;
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#080808;
border-top:1px solid #222;
justify-content:space-around;
align-items:center;
z-index:10;
}

nav button{
background:none;
border:0;
color:#aaa;
font-size:13px;
}

.add{
background:#08f!important;
color:#fff!important;
border-radius:50%;
font-size:28px!important;
width:48px;
height:48px;
}

.n{
padding:14px 0;
border-bottom:1px solid #222;
}

.unread{
background:#111;
}

.badge{
color:#f33;
font-weight:bold;
}

.hidden{
display:none!important;
}
</style>
</head>

<body>

<header>

<div class="logo">
We <span>Media</span>
</div>

<div>

<button
id="bell"
class="hidden"
onclick="page('notifications')">
🔔 <span id="nc">0</span>
</button>

<button
id="logout"
class="hidden"
onclick="logout()">
Logout
</button>

</div>

</header>

<section id="inbox" class="page">

<div class="notice">

<h2>💬 Messages</h2>

<div id="inboxList" class="msg">
Loading...
</div>

</div>

</section>

<section id="chat" class="page">

<div class="notice">

<button
class="back"
onclick="openInbox()">
← Back
</button>

<h2 id="chatName">
💬 Chat
</h2>

<div
id="chatbox"
style="
height:55vh;
overflow-y:auto;
background:#050505;
border:1px solid #222;
border-radius:12px;
padding:10px;
margin-top:15px;
">
</div>

<div
style="
display:flex;
gap:7px;
margin-top:10px;
">

<input
id="chatText"
class="input"
placeholder="Write a message..."
style="margin:0"
onkeydown="if(event.key==='Enter')sendMessage()">

<button
class="profile-btn"
onclick="sendMessage()">
SEND
</button>

</div>

</div>

</section>

<main>

<section id="login" class="page active">

<div class="auth">

<div class="box">

<h1>
We <span style="color:#09f">Media</span>
</h1>

<p>Welcome back</p>

<input
id="le"
class="input"
placeholder="Email">

<input
id="lp"
class="input"
type="password"
placeholder="Password">

<div id="lm" class="msg"></div>

<button
class="primary"
onclick="login()">
LOGIN
</button>

<div class="switch">
No account?
<button onclick="auth('register')">
Create Account
</button>
</div>

</div>

</div>

</section>

<section id="register" class="page">

<div class="auth">

<div class="box">

<h1>
We <span style="color:#09f">Media</span>
</h1>

<p>Create account</p>

<input
id="rn"
class="input"
placeholder="Username">

<input
id="re"
class="input"
placeholder="Email">

<input
id="rp"
class="input"
type="password"
placeholder="Password">

<input
id="rc"
class="input"
type="password"
placeholder="Confirm password">

<div id="rm" class="msg"></div>

<button
class="primary"
onclick="register()">
CREATE ACCOUNT
</button>

<div class="switch">
Have account?
<button onclick="auth('login')">
Login
</button>
</div>

</div>

</div>

</section>

<section id="home" class="page">

<div class="search">

<input
id="searchBox"
placeholder="🔍 Search users..."
oninput="searchUsers()">

</div>

<div id="results" class="results"></div>

<div id="videos">
<div class="msg">Loading...</div>
</div>

</section>

<section id="upload" class="page">

<div class="upload">

<h2>Upload Video</h2>

<p>Share your video</p>

<input
id="title"
class="input"
placeholder="Video title">

<input
id="file"
type="file"
accept="video/*">

<div id="um" class="msg"></div>

<button
class="primary"
onclick="upload()">
📤 UPLOAD VIDEO
</button>

</div>

</section>

<section id="profile" class="page">

<div class="profile">

<div class="avatar">
👤
</div>

<h2 id="name">
User
</h2>

<p id="email">
-
</p>

<div class="stats">

<div>
<b id="vc">0</b>
<small>Videos</small>
</div>

<div>
<b id="followers">0</b>
<small>Followers</small>
</div>

<div>
<b id="following">0</b>
<small>Following</small>
</div>

</div>

<button
class="primary"
onclick="openInbox()">
💬 Messages
</button>

<button
class="primary"
onclick="logout()">
LOGOUT
</button>

</div>

</section>

<section id="publicProfile" class="page">

<div class="public-profile">

<button
class="back"
onclick="page('home')">
← Back
</button>

<div class="avatar">
👤
</div>

<h2 id="publicName">
User
</h2>

<p id="publicEmail"></p>

<div class="stats">

<div>
<b id="publicVideos">0</b>
<small>Videos</small>
</div>

<div>
<b id="publicFollowers">0</b>
<small>Followers</small>
</div>

<div>
<b id="publicFollowing">0</b>
<small>Following</small>
</div>

</div>

<div style="text-align:center">

<button
id="publicFollow"
class="profile-btn"
onclick="togglePublicFollow()">
Follow
</button>

<button
class="profile-btn"
onclick="startChat()">
💬 Message
</button>

</div>

<div
id="publicVideosBox"
style="margin-top:25px">
</div>

</div>

</section>

<section id="notifications" class="page">

<div class="notice">

<h2>🔔 Notifications</h2>

<div id="notices" class="msg">
Loading...
</div>

</div>

</section>

</main>

<nav id="nav">

<button onclick="page('home')">
🏠<br>Home
</button>

<button
class="add"
onclick="page('upload')">
+
</button>

<button onclick="page('profile')">
👤<br>Profile
</button>

</nav>

<script>

const U =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const K =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
supabase.createClient(U,K);

let user=null;
let publicUser=null;
let chatUser=null;
let chatChannel=null;

const $=x=>document.getElementById(x);


/* AUTH */

function auth(x){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

$(x).classList.add("active");

$("nav").style.display="none";
$("bell").classList.add("hidden");
$("logout").classList.add("hidden");

}


/* REGISTER */

async function register(){

let n=$("rn").value.trim();
let e=$("re").value.trim();
let p=$("rp").value;
let c=$("rc").value;

if(!n||!e||p.length<6||p!==c){

$("rm").textContent="❌ Check your details";
return;
}

$("rm").textContent="Creating...";

let {data,error}=await sb.auth.signUp({

email:e,
password:p,

options:{
data:{
username:n
}
}

});

if(error){

$("rm").textContent="❌ "+error.message;
return;
}

if(data.session){

user=data.user;

await sb.from("profiles").upsert({

id:user.id,
username:n,
email:e

});

open();

}else{

$("rm").textContent=
"✅ Account created. Check email then login.";

}

}


/* LOGIN */

async function login(){

let e=$("le").value.trim();
let p=$("lp").value;

if(!e||!p){

$("lm").textContent=
"❌ Enter email and password";

return;
}

$("lm").textContent="Logging in...";

let {data,error}=
await sb.auth.signInWithPassword({

email:e,
password:p

});

if(error){

$("lm").textContent=
"❌ "+error.message;

return;
}

user=data.user;

$("lm").textContent=
"✅ Login successful";

open();

}


/* OPEN */

function open(){

$("nav").style.display="flex";
$("bell").classList.remove("hidden");
$("logout").classList.remove("hidden");

page("home");

load();
loadProfile();
notifyCount();

}


/* PAGE */

function page(x){

if(!user){

auth("login");
return;
}

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

$(x).classList.add("active");

scrollTo(0,0);

if(x==="home")load();
if(x==="profile")loadProfile();
if(x==="notifications")notifications();

}


/* LOGOUT */

async function logout(){

if(chatChannel){

await sb.removeChannel(chatChannel);
chatChannel=null;

}

await sb.auth.signOut();

user=null;
chatUser=null;

$("nav").style.display="none";
$("bell").classList.add("hidden");
$("logout").classList.add("hidden");

auth("login");

}


/* SEARCH */

async function searchUsers(){

let q=$("searchBox").value.trim();
let box=$("results");

if(!q){

box.innerHTML="";
return;

}

let {data,error}=await sb
.from("profiles")
.select("id,username,email")
.ilike("username","%"+q+"%")
.limit(20);

if(error){

box.innerHTML=
'<div class="msg">❌ '+esc(error.message)+'</div>';

return;
}

if(!data?.length){

box.innerHTML=
'<div class="msg">No users found</div>';

return;
}

box.innerHTML="";

data.forEach(x=>{

let d=document.createElement("div");

d.className="result";

d.innerHTML=`

<div>
👤 <b>${esc(x.username||"User")}</b>
</div>

<button
onclick="openPublicProfile('${x.id}')">
View
</button>

`;

box.appendChild(d);

});

}


/* PUBLIC PROFILE */

async function openPublicProfile(id){

if(String(id)===String(user.id)){

page("profile");
return;

}

publicUser=String(id);

page("publicProfile");

$("publicName").textContent="Loading...";
$("publicEmail").textContent="";

$("publicVideosBox").innerHTML=
'<div class="msg">Loading...</div>';

let {data:p,error}=await sb
.from("profiles")
.select("*")
.eq("id",id)
.maybeSingle();

if(error||!p){

$("publicName").textContent="User not found";
return;

}

$("publicName").textContent=p.username||"User";
$("publicEmail").textContent=p.email||"";

let {count:vc}=await sb
.from("videos")
.select("*",{count:"exact",head:true})
.eq("user_id",id);

let {count:followers}=await sb
.from("follows")
.select("*",{count:"exact",head:true})
.eq("following_id",id);

let {count:following}=await sb
.from("follows")
.select("*",{count:"exact",head:true})
.eq("follower_id",id);

$("publicVideos").textContent=vc||0;
$("publicFollowers").textContent=followers||0;
$("publicFollowing").textContent=following||0;

await publicFollowState(id);
await loadPublicVideos(id);

}


/* FOLLOW STATE */

async function publicFollowState(id){

let b=$("publicFollow");

let {data}=await sb
.from("follows")
.select("id")
.eq("follower_id",String(user.id))
.eq("following_id",String(id));

if(data?.length){

b.textContent="Following";
b.classList.add("follow");

}else{

b.textContent="Follow";
b.classList.remove("follow");

}

}


/* PUBLIC FOLLOW */

async function togglePublicFollow(){

if(!publicUser)return;

let me=String(user.id);
let to=String(publicUser);

let {data}=await sb
.from("follows")
.select("id")
.eq("follower_id",me)
.eq("following_id",to);

let b=$("publicFollow");

if(data?.length){

await sb
.from("follows")
.delete()
.eq("id",data[0].id);

b.textContent="Follow";
b.classList.remove("follow");

}else{

let {error}=await sb
.from("follows")
.insert({

follower_id:me,
following_id:to

});

if(error){

alert("❌ "+error.message);
return;

}

b.textContent="Following";
b.classList.add("follow");

await notice(to,"👤 started following you");

}

notifyCount();
loadProfile();

}


/* PUBLIC VIDEOS */

async function loadPublicVideos(id){

let box=$("publicVideosBox");

let {data,error}=await sb
.from("videos")
.select("*")
.eq("user_id",id)
.order("created_at",{ascending:false});

if(error){

box.innerHTML="❌ "+error.message;
return;

}

if(!data?.length){

box.innerHTML=
'<div class="msg">🎬 No videos yet</div>';

return;

}

box.innerHTML="";

for(const v of data){

await card(v,box);

}

}


/* HOME */

async function load(){

let box=$("videos");

if(!box)return;

box.innerHTML=
'<div class="msg">Loading...</div>';

let {data,error}=await sb
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){

box.innerHTML="❌ "+error.message;
return;

}

if(!data?.length){

box.innerHTML=
'<div class="msg">🎬 No videos yet</div>';

return;

}

box.innerHTML="";

for(const v of data){

await card(v,box);

}

}
 /* VIDEO CARD */

async function card(v,box){

let d=document.createElement("div");

d.className="video-card";

let videoUrl=v.video_url||v.url||"";
let username="User";

let {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",v.user_id)
.maybeSingle();

if(p?.username)username=p.username;

let {count:likes}=await sb
.from("likes")
.select("*",{count:"exact",head:true})
.eq("video_id",v.id);

let {count:comments}=await sb
.from("comments")
.select("*",{count:"exact",head:true})
.eq("video_id",v.id);

let {data:liked}=await sb
.from("likes")
.select("id")
.eq("video_id",v.id)
.eq("user_id",user.id);

let {data:followed}=await sb
.from("follows")
.select("id")
.eq("follower_id",user.id)
.eq("following_id",v.user_id);

let mine=
String(v.user_id)===String(user.id);

d.innerHTML=`

<video
src="${esc(videoUrl)}"
controls
playsinline
preload="metadata">
</video>

<div class="info">

<div
class="user clickable"
onclick="openPublicProfile('${v.user_id}')">
👤 ${esc(username)}
</div>

<h3>${esc(v.title||"Untitled video")}</h3>

<div class="date">
${v.created_at?
new Date(v.created_at).toLocaleString():""}
</div>

<div class="actions">

<button
class="${liked?.length?"liked":""}"
onclick="toggleLike('${v.id}',this)">
❤️ <span>${likes||0}</span>
</button>

<button
onclick="toggleComments('${v.id}')">
💬 <span>${comments||0}</span>
</button>

${!mine?`

<button
class="${followed?.length?"follow":""}"
onclick="toggleFollow('${v.user_id}',this)">
${followed?.length?
"Following":"Follow"}
</button>

`:""}

<button
onclick="shareVideo('${v.id}')">
↗ Share
</button>

</div>

<div
id="comments-${v.id}"
class="comments">

<div id="commentList-${v.id}">
</div>

<div style="
display:flex;
gap:6px;
margin-top:8px;
">

<input
id="commentInput-${v.id}"
class="input"
placeholder="Write a comment..."
style="margin:0">

<button
class="profile-btn"
onclick="addComment('${v.id}')">
Send
</button>

</div>

</div>

</div>
`;

box.appendChild(d);

}


/* LIKE */

async function toggleLike(videoId,btn){

let {data}=await sb
.from("likes")
.select("id")
.eq("video_id",videoId)
.eq("user_id",user.id);

if(data?.length){

await sb
.from("likes")
.delete()
.eq("id",data[0].id);

btn.classList.remove("liked");

}else{

let {error}=await sb
.from("likes")
.insert({
video_id:videoId,
user_id:user.id
});

if(error){

alert("❌ "+error.message);
return;

}

btn.classList.add("liked");

}

let {count}=await sb
.from("likes")
.select("*",{count:"exact",head:true})
.eq("video_id",videoId);

let span=btn.querySelector("span");

if(span)span.textContent=count||0;

}


/* COMMENTS */

async function toggleComments(videoId){

let box=$("comments-"+videoId);

if(!box)return;

if(box.style.display==="block"){

box.style.display="none";
return;

}

box.style.display="block";

await loadComments(videoId);

}


/* LOAD COMMENTS */

async function loadComments(videoId){

let box=$("commentList-"+videoId);

if(!box)return;

box.innerHTML=
'<div class="msg">Loading...</div>';

let {data,error}=await sb
.from("comments")
.select("*")
.eq("video_id",videoId)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=
"❌ "+esc(error.message);

return;

}

if(!
   data?.length){

box.innerHTML=
'<div class="msg">No comments yet</div>';

return;

}

box.innerHTML="";

for(const c of data){

let username="User";

let {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",c.user_id)
.maybeSingle();

if(p?.username)
username=p.username;

let x=document.createElement("div");

x.className="comment";

x.innerHTML=`
<b>${esc(username)}</b>
<br>
${esc(c.comment||c.text||"")}
`;

box.appendChild(x);

}

}


/* ADD COMMENT */

async function addComment(videoId){

let input=$("commentInput-"+videoId);

if(!input)return;

let text=input.value.trim();

if(!text)return;

let {error}=await sb
.from("comments")
.insert({
video_id:videoId,
user_id:user.id,
comment:text
});

if(error){

let retry=await sb
.from("comments")
.insert({
video_id:videoId,
user_id:user.id,
text:text
});

if(retry.error){

alert("❌ "+error.message);
return;

}

}

input.value="";

await loadComments(videoId);

}


/* FOLLOW */

async function toggleFollow(id,btn){

let target=String(id);

let {data}=await sb
.from("follows")
.select("id")
.eq("follower_id",String(user.id))
.eq("following_id",target);

if(data?.length){

await sb
.from("follows")
.delete()
.eq("id",data[0].id);

btn.textContent="Follow";
btn.classList.remove("follow");

}else{

let {error}=await sb
.from("follows")
.insert({
follower_id:String(user.id),
following_id:target
});

if(error){

alert("❌ "+error.message);
return;

}

btn.textContent="Following";
btn.classList.add("follow");

await notice(
target,
"👤 started following you"
);

}

notifyCount();
loadProfile();

}


/* SHARE */

async function shareVideo(id){

let url=
location.origin+
location.pathname+
"?video="+
encodeURIComponent(id);

if(navigator.share){

try{

await navigator.share({
title:"We Media",
text:"Watch this video on We Media",
url:url
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(url);

alert("✅ Video link copied");

}catch(e){

prompt("Copy this video link:",url);

}

}

}


/* UPLOAD */

async function upload(){

let title=$("title").value.trim();
let file=$("file").files[0];

if(!file){

$("um").textContent=
"❌ Select a video first";

return;

}

if(!title){

$("um").textContent=
"❌ Enter video title";

return;

}

$("um").textContent="Uploading...";

let ext=
file.name.split(".").pop();

let path=
user.id+
"/"+
Date.now()+
"."+
ext;

let {error}=await sb
.storage
.from("Videos")
.upload(path,file,{
contentType:file.type,
upsert:false
});

if(error){

$("um").textContent=
"❌ "+error.message;

return;

}

let {data:pub}=sb
.storage
.from("Videos")
.getPublicUrl(path);

let {error:dbError}=await sb
.from("videos")
.insert({
user_id:user.id,
title:title,
video_url:pub.publicUrl
});

if(dbError){

$("um").textContent=
"❌ "+dbError.message;

return;

}

$("um").textContent=
"✅ Video uploaded successfully";

$("title").value="";
$("file").value="";

setTimeout(()=>{
page("home");
},1000);

}


/* PROFILE */

async function loadProfile(){

if(!user)return;

let {data:p}=await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

$("name").textContent=
p?.username||
user.user_metadata?.username||
"User";

$("email").textContent=
p?.email||
user.email||
"-";

let {count:vc}=await sb
.from("videos")
.select("*",{count:"exact",head:true})
.eq("user_id",user.id);

let {count:followers}=await sb
.from("follows")
.select("*",{count:"exact",head:true})
.eq("following_id",user.id);

let {count:following}=await sb
.from("follows")
.select("*",{count:"exact",head:true})
.eq("follower_id",user.id);

$("vc").textContent=vc||0;
$("followers").textContent=followers||0;
$("following").textContent=following||0;

}


/* NOTIFICATION */

async function notice(to,text){

await sb
.from("notifications")
.insert({
user_id:String(to),
actor_id:String(user.id),
text:text,
read:false
});

}


/* NOTIFICATION COUNT */

async function notifyCount(){

if(!user)return;

let {count}=await sb
.from("notifications")
.select("*",{count:"exact",head:true})
.eq("user_id",String(user.id))
.eq("read",false);

$("nc").textContent=count||0;

}


/* NOTIFICATIONS */

async function notifications(){

let box=$("notices");

box.innerHTML=
'<div class="msg">Loading...</div>';

let {data,error}=await sb
.from("notifications")
.select("*")
.eq("user_id",String(user.id))
.order("created_at",{ascending:false})
.limit(50);

if(error){

box.innerHTML=
"❌ "+esc(error.message);

return;

}

if(!data?.length){

box.innerHTML=
'<div class="msg">No notifications</div>';

return;

}

box.innerHTML="";

data.forEach(n=>{

let d=document.createElement("div");

d.className=
"n "+(!n.read?"unread":"");

d.innerHTML=`

<div>
${esc(n.text||"Notification")}
</div>

<div class="user">
${n.created_at?
new Date(n.created_at).toLocaleString():""}
</div>

`;

box.appendChild(d);

});

await sb
.from("notifications")
.update({read:true})
.eq("user_id",String(user.id))
.eq("read",false);

notifyCount();

}


/* INBOX */

async function openInbox(){

page("inbox");

await loadInbox();

}


/* LOAD INBOX */

async function loadInbox(){

let box=$("inboxList");

box.innerHTML=
'<div class="msg">Loading...</div>';

let {data,error}=await sb
.from("messages")
.select("*")
.or(
"sender_id.eq."+String(user.id)+
",receiver_id.eq."+String(user.id)
)
.order("created_at",{ascending:false});

if(error){

box.innerHTML=
"❌ "+esc(error.message);

return;

}

if(!data?.length){

box.innerHTML=
'<div class="msg">No messages yet</div>';

return;

}

let people={};

for(const m of data){

let other=
String(m.sender_id)===String(user.id)
?m.receiver_id
:m.sender_id;

if(!people[other])
people[other]=m;

}

box.innerHTML="";

for(const id in people){

let {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",id)
.maybeSingle();

let name=
p?.username||"User";

let d=document.createElement("div");

d.className="result";

d.innerHTML=`

<div>
💬 <b>${esc(name)}</b>
</div>

<button
onclick="openChat('${id}','${esc(name)}')">
Chat
</button>

`;

box.appendChild(d);

}

}


/* OPEN CHAT */

async function openChat(id,name){

chatUser=String(id);

$("chatName").textContent=
"💬 "+name;

page("chat");

await loadChat();

if(chatChannel){

await sb.removeChannel(chatChannel);

}

chatChannel=
sb.channel(
"chat-"+user.id+"-"+chatUser
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
payload=>{

let m=payload.new;

if(
String(m.sender_id)===String(chatUser)&&
String(m.receiver_id)===String(user.id)
){

loadChat();

}

}
)
.subscribe();

}


/* LOAD CHAT */

async function loadChat(){

let box=$("chatbox");

box.innerHTML=
'<div class="msg">Loading...</div>';

let {data,error}=await sb
.from("messages")
.select("*")
.or(
"and(sender_id.eq."+String(user.id)+
",receiver_id.eq."+String(chatUser)+
"),and(sender_id.eq."+String(chatUser)+
",receiver_id.eq."+String(user.id)+")"
)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=
"❌ "+esc(error.message);

return;

}

box.innerHTML="";

if(!data?.length){

box.innerHTML=
'<div class="msg">Start the conversation</div>';

return;

}

for(const m of data){

let mine=
String(m.sender_id)===String(user.id);

let d=document.createElement("div");

d.style.textAlign=
mine?"right":"left";

d.style.margin="8px 0";

d.innerHTML=`

<div style="
display:inline-block;
padding:9px 12px;
border-radius:15px;
background:${mine?"#08f":"#222"};
max-width:80%;
">

${esc(m.message||"")}

</div>

`;

box.appendChild(d);

}

box.scrollTop=box.scrollHeight;

}


/* SEND MESSAGE */

async function sendMessage(){

if(!chatUser)return;

let input=$("chatText");

let text=input.value.trim();

if(!text)return;

let {error}=await sb
.from("messages")
.insert({

sender_id:String(user.id),
receiver_id:String(chatUser),
message:text

});

if(error){

alert("❌ "+error.message);
return;

}

input.value="";

await loadChat();
await loadInbox();

}


/* START CHAT */

async function startChat(){

if(!publicUser)return;

let {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",publicUser)
.maybeSingle();

openChat(
publicUser,
p?.username||"User"
);

}


/* ESCAPE */

function esc(x){

return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* AUTO LOGIN */

(async()=>{

let {data}=await sb.auth.getSession();

if(data?.session){

user=data.session.user;

open();

}else{

auth("login");

}

})();

</script>
