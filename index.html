<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding-bottom:70px}
button{cursor:pointer}

header{
position:fixed;top:0;left:0;right:0;height:58px;
background:#000;border-bottom:1px solid #222;
display:flex;align-items:center;justify-content:space-between;
padding:0 15px;z-index:1000
}
.logo{font-size:22px;font-weight:bold}
.logo span,.auth-logo span{color:#0099ff}
.header-btn{
background:#111;color:#fff;border:1px solid #333;
border-radius:20px;padding:8px 13px
}

main{padding-top:60px}
.page{display:none}
.page.active{display:block}

.auth{
min-height:calc(100vh - 60px);
display:flex;align-items:center;justify-content:center;
padding:25px 20px
}
.auth-box{width:100%;max-width:430px;text-align:center}
.auth-logo{font-size:35px;font-weight:bold;margin-bottom:8px}
.auth-box p{color:#888;margin-bottom:25px}

.input{
width:100%;background:#111;color:#fff;
border:1px solid #333;border-radius:10px;
padding:14px;margin-bottom:12px;outline:none
}
.input:focus{border-color:#0099ff}

.password-box{position:relative}
.password-box .input{padding-right:50px}
.eye{
position:absolute;right:14px;top:12px;
background:none;border:0;color:#aaa;font-size:18px
}

.primary{
width:100%;background:#008cff;color:#fff;border:0;
border-radius:25px;padding:14px;font-size:16px;
font-weight:bold;margin-top:5px
}
.auth-message{min-height:25px;margin:12px 0;font-size:14px}
.switch{margin-top:20px;color:#888}
.switch button{
background:none;border:0;color:#0099ff;font-size:15px
}

.video-card{
border-bottom:1px solid #222;
margin-bottom:20px;padding-bottom:18px
}
.video-box{width:100%;background:#111}
.video-box video{
width:100%;max-height:650px;display:block;
object-fit:contain;background:#000
}
.video-info{padding:10px 12px}
.video-title{font-size:17px;font-weight:bold;margin-bottom:6px}
.video-user{color:#aaa;font-size:13px;margin-bottom:6px}
.video-date{color:#666;font-size:11px;margin-bottom:10px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{
background:#151515;color:#fff;border:1px solid #333;
border-radius:20px;padding:8px 12px
}
.actions button.liked{color:#ff3b6b}

.comment-box{display:none;margin-top:12px}
.comment-box textarea{
width:100%;min-height:65px;background:#111;color:#fff;
border:1px solid #333;border-radius:10px;padding:10px;resize:none
}
.comment-list{margin-top:10px}
.comment{border-bottom:1px solid #222;padding:8px 0;font-size:14px}

.loading{text-align:center;color:#888;padding:50px 20px}
.empty{text-align:center;color:#888;padding:70px 20px}
.empty-icon{font-size:55px;margin-bottom:15px}

.upload{padding:25px 20px;max-width:600px;margin:auto}
.upload h2{margin-bottom:8px}
.upload p{color:#888;margin-bottom:20px}
.file-box{
background:#111;border:1px dashed #444;
border-radius:12px;padding:20px;margin-bottom:15px
}
.progress{
display:none;width:100%;height:8px;background:#222;
border-radius:10px;margin-top:15px;overflow:hidden
}
.progress-bar{
width:0%;height:100%;background:#008cff;transition:.2s
}
.upload-message{text-align:center;margin-top:15px}

.profile{
padding:35px 20px;text-align:center;
max-width:500px;margin:auto
}
.avatar{
width:90px;height:90px;background:#008cff;
border-radius:50%;margin:10px auto 15px;
display:flex;align-items:center;justify-content:center;
font-size:38px
}
.profile h2{margin-bottom:6px}
.profile-email{color:#888;margin-bottom:25px}
.stats{
display:flex;justify-content:center;gap:50px;margin:25px 0
}
.stat strong{display:block;font-size:22px}
.stat span{color:#888;font-size:12px}
.logout{
background:#111;color:#fff;border:1px solid #444;
border-radius:25px;padding:12px 35px
}

.bottom-nav{
position:fixed;bottom:0;left:0;right:0;height:65px;
background:#080808;border-top:1px solid #222;
display:none;align-items:center;justify-content:space-around;
z-index:1000
}
.nav-btn{
background:none;border:0;color:#777;font-size:12px;text-align:center
}
.nav-btn.active{color:#fff}
.nav-icon{display:block;font-size:21px;margin-bottom:3px}
.upload-nav{
width:48px;height:48px;border-radius:50%;
background:#008cff;color:#fff;border:0;font-size:27px
}
.hidden{display:none!important}
</style>
</head>

<body>

<header>
<div class="logo">We <span>Media</span></div>
<button id="headerAuthBtn" class="header-btn hidden" onclick="logout()">Logout</button>
</header>

<main>

<!-- LOGIN -->
<section id="loginPage" class="page active">
<div class="auth">
<div class="auth-box">

<div class="auth-logo">We <span>Media</span></div>
<p>Welcome back</p>

<input id="loginEmail" class="input" type="email" placeholder="Email">

<div class="password-box">
<input id="loginPassword" class="input" type="password" placeholder="Password">
<button class="eye" onclick="togglePassword('loginPassword',this)">👁</button>
</div>

<div id="loginMessage" class="auth-message"></div>

<button class="primary" onclick="login()">LOGIN</button>

<div class="switch">
Don't have an account?
<button onclick="showAuth('registerPage')">Create Account</button>
</div>

</div>
</div>
</section>

<!-- REGISTER -->
<section id="registerPage" class="page">
<div class="auth">
<div class="auth-box">

<div class="auth-logo">We <span>Media</span></div>
<p>Create your account</p>

<input id="registerName" class="input" type="text" placeholder="Username">

<input id="registerEmail" class="input" type="email" placeholder="Email">

<div class="password-box">
<input id="registerPassword" class="input" type="password" placeholder="Password">
<button class="eye" onclick="togglePassword('registerPassword',this)">👁</button>
</div>

<div class="password-box">
<input id="registerConfirm" class="input" type="password" placeholder="Confirm password">
<button class="eye" onclick="togglePassword('registerConfirm',this)">👁</button>
</div>

<div id="registerMessage" class="auth-message"></div>

<button class="primary" onclick="register()">CREATE ACCOUNT</button>

<div class="switch">
Already have an account?
<button onclick="showAuth('loginPage')">Login</button>
</div>

</div>
</div>
</section>

<!-- HOME -->
<section id="homePage" class="page">
<div id="videoList">
<div class="loading">Loading videos...</div>
</div>
</section>

<!-- UPLOAD -->
<section id="uploadPage" class="page">
<div class="upload">

<h2>Upload Video</h2>
<p>Share your video on We Media</p>

<input id="videoTitle" class="input" type="text" placeholder="Video title">

<div class="file-box">
<input id="videoFile" type="file" accept="video/*">
</div>

<button class="primary" onclick="uploadVideo()">📤 UPLOAD VIDEO</button>

<div id="uploadProgress" class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="uploadMessage" class="upload-message"></div>

</div>
</section>

<!-- PROFILE -->
<section id="profilePage" class="page">
<div class="profile">

<div class="avatar">👤</div>

<h2 id="profileName">User</h2>
<div id="profileEmail" class="profile-email">-</div>

<div class="stats">

<div class="stat">
<strong id="videoCount">0</strong>
<span>Videos</span>
</div>

<div class="stat">
<strong id="likeCount">0</strong>
<span>Likes</span>
</div>

</div>

<button class="logout" onclick="logout()">LOGOUT</button>

</div>
</section>

</main>

<!-- NAV -->
<nav id="bottomNav" class="bottom-nav">

<button id="homeNav" class="nav-btn active"
onclick="showPage('homePage',this)">
<span class="nav-icon">🏠</span>
Home
</button>

<button class="upload-nav"
onclick="showPage('uploadPage',this)">+</button>

<button id="profileNav" class="nav-btn"
onclick="showPage('profilePage',this)">
<span class="nav-icon">👤</span>
Profile
</button>

</nav>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;


/* AUTH */

function showAuth(id){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.getElementById("bottomNav").style.display="none";

document.getElementById("headerAuthBtn")
.classList.add("hidden");

window.scrollTo(0,0);
}


function togglePassword(id,btn){

const input=document.getElementById(id);

if(input.type==="password"){
input.type="text";
btn.textContent="🙈";
}else{
input.type="password";
btn.textContent="👁";
}
}


/* REGISTER */

async function register(){

const name=document.getElementById("registerName").value.trim();
const email=document.getElementById("registerEmail").value.trim();
const password=document.getElementById("registerPassword").value;
const confirm=document.getElementById("registerConfirm").value;
const message=document.getElementById("registerMessage");

message.textContent="";

if(!name){
message.textContent="❌ Enter your username.";
return;
}

if(!email){
message.textContent="❌ Enter your email.";
return;
}

if(password.length<6){
message.textContent="❌ Password must be at least 6 characters.";
return;
}

if(password!==confirm){
message.textContent="❌ Passwords do not match.";
return;
}

message.textContent="Creating account...";

try{

const {data,error}=await supabaseClient.auth.signUp({
email:email,
password:password,
options:{
data:{username:name}
}
});

if(error) throw error;

if(data.session){

currentUser=data.user;

await createProfile(data.user,name);

message.textContent="✅ Account created successfully.";

setTimeout(openApp,500);

}else{

message.textContent=
"✅ Account created. Check your email to confirm, then login.";

}

}catch(error){

console.error(error);
message.textContent="❌ "+error.message;

}

}


/* LOGIN */

async function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;
const message=document.getElementById("loginMessage");

message.textContent="";

if(!email||!password){
message.textContent="❌ Enter email and password.";
return;
}

message.textContent="Logging in...";

try{

const {data,error}=
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error) throw error;

currentUser=data.user;

message.textContent="✅ Login successful.";

setTimeout(openApp,400);

}catch(error){

console.error(error);
message.textContent="❌ "+error.message;

}

}


/* PROFILE CREATION */

async function createProfile(user,name){

const {error}=await supabaseClient
.from("profiles")
.upsert({
id:user.id,
username:name,
email:user.email
});

if(error){
console.log("Profile error:",error.message);
}

}


/* APP */

function openApp(){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById("homePage")
.classList.add("active");

document.getElementById("bottomNav")
.style.display="flex";

document.getElementById("headerAuthBtn")
.classList.remove("hidden");

loadVideos();
loadProfile();

window.scrollTo(0,0);
}


function showPage(pageId,button){

if(!currentUser){
showAuth("loginPage");
return;
}

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(pageId).classList.add("active");

document.querySelectorAll(".nav-btn")
.forEach(btn=>btn.classList.remove("active"));

if(button && button.classList.contains("nav-btn")){
button.classList.add("active");
}

if(pageId==="homePage") loadVideos();
if(pageId==="profilePage") loadProfile();

window.scrollTo(0,0);
}


/* SESSION */

async function checkSession(){

const {data}=await supabaseClient.auth.getSession();

if(data.session){

currentUser=data.session.user;
openApp();

}else{

showAuth("loginPage");

}

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

currentUser=null;

document.getElementById("bottomNav")
.style.display="none";

document.getElementById("headerAuthBtn")
.classList.add("hidden");

showAuth("loginPage");

}


/* VIDEOS */

async function loadVideos(){

const container=document.getElementById("videoList");

container.innerHTML=
'<div class="loading">Loading videos...</div>';

try{

const {data,error}=await supabaseClient
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error) throw error;

if(!data||data.length===0){

container.innerHTML=`
<div class="empty">
<div class="empty-icon">🎬</div>
No videos yet.
<br><br>
Upload the first video.
</div>`;

document.getElementById("videoCount").textContent="0";

return;
}

container.innerHTML="";

data.forEach(video=>{
createVideoCard(video,container);
});

document.getElementById("videoCount")
.textContent=data.length;

}catch(error){

console.error(error);

container.innerHTML=`
<div class="empty">
❌ Unable to load videos.
<br><br>
${escapeHtml(error.message)}
</div>`;

}

}


/* VIDEO CARD */

function createVideoCard(video,container){

let url=video.url||video.video_url||video.public_url;

if(!url && video.file_name){

const result=supabaseClient
.storage
.from("Videos")
.getPublicUrl(video.file_name);

url=result.data.publicUrl;
}

if(!url && video.path){

const result=supabaseClient
.storage
.from("Videos")
.getPublicUrl(video.path);

url=result.data.publicUrl;
}

if(!url) return;

const title=video.title||"We Media Video";
const username=video.username||"We Media User";

const date=video.created_at
?new Date(video.created_at).toLocaleString()
:"";

const card=document.createElement("div");
card.className="video-card";

card.innerHTML=`

<div class="video-box">
<video
src="${escapeHtml(url)}"
controls
playsinline
preload="metadata">
</video>
</div>

<div class="video-info">

<div class="video-title">
${escapeHtml(title)}
</div>

<div class="video-user">
👤 ${escapeHtml(username)}
</div>

<div class="video-date">
${escapeHtml(date)}
</div>

<div class="actions">

<button onclick="likeVideo(this)">
❤️ <span>0</span>
</button>

<button onclick="toggleComments(this)">
💬 Comment
</button>

<button onclick="shareVideo('${escapeJs(url)}')">
📤 Share
</button>

</div>

<div class="comment-box">

<textarea placeholder="Write a comment..."></textarea>

<button class="primary"
onclick="addComment(this)">
Post Comment
</button>

<div class="comment-list"></div>

</div>

</div>
`;

container.appendChild(card);

}


/* LIKE */

function likeVideo(button){

const span=button.querySelector("span");

let count=parseInt(span.textContent||"0");

count++;

span.textContent=count;

button.classList.add("liked");

const likeCount=document.getElementById("likeCount");

likeCount.textContent=
parseInt(likeCount.textContent||"0")+1;

}


/* COMMENTS */

function toggleComments(button){

const box=button.closest(".video-info")
.querySelector(".comment-box");

box.style.display=
box.style.display==="block"
?"none":"block";

}


function addComment(button){

const box=button.closest(".comment-box");

const textarea=box.querySelector("textarea");

const text=textarea.value.trim();

if(!text){
alert("Write a comment first.");
return;
}

const list=box.querySelector(".comment-list");

const comment=document.createElement("div");

comment.className="comment";
comment.textContent="👤 "+text;

list.appendChild(comment);

textarea.value="";

}


/* SHARE */

async function shareVideo(url){

try{

if(navigator.share){

await navigator.share({
title:"We Media",
text:"Check out this video on We Media",
url:url
});

}else{

await navigator.clipboard.writeText(url);

alert("Video link copied!");

}

}catch(error){

console.log(error);

}

}


/* UPLOAD */

async function uploadVideo(){

if(!currentUser){

alert("Please login first.");
return;

}

const title=document.getElementById("videoTitle")
.value.trim();

const file=document.getElementById("videoFile")
.files[0];

const message=document.getElementById("uploadMessage");

const progress=document.getElementById("uploadProgress");
const bar=document.getElementById("progressBar");

message.textContent="";

if(!title){

message.textContent="❌ Enter video title.";
return;

}

if(!file){

message.textContent="❌ Select a video.";
return;

}

if(!file.type.startsWith("video/")){

message.textContent="❌ Please select a video file.";
return;

}

message.textContent="Uploading...";
progress.style.display="block";
bar.style.width="20%";

try{

const safeName=file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const filePath=
currentUser.id+"/"+Date.now()+"_"+safeName;

const {error:uploadError}=
await supabaseClient.storage
.from("Videos")
.upload(filePath,file,{
cacheControl:"3600",
upsert:false
});

if(uploadError) throw uploadError;

bar.style.width="75%";

const {data:urlData}=
supabaseClient.storage
.from("Videos")
.getPublicUrl(filePath);

const publicUrl=urlData.publicUrl;

const username=
currentUser.user_metadata?.username ||
currentUser.email?.split("@")[0] ||
"We Media User";

const {error:dbError}=
await supabaseClient
.from("videos")
.insert({
title:title,
url:publicUrl,
file_name:filePath,
username:username,
user_id:currentUser.id
});

if(dbError) throw dbError;

bar.style.width="100%";

message.textContent="✅ Video uploaded successfully!";

document.getElementById("videoTitle").value="";
document.getElementById("videoFile").value="";

setTimeout(()=>{

showPage("homePage",
document.getElementById("homeNav"));

},1000);

}catch(error){

console.error(error);

message.textContent="❌ "+error.message;

bar.style.width="0%";

}

}


/* PROFILE */

async function loadProfile(){

if(!currentUser) return;

let username=
currentUser.user_metadata?.username;

try{

const {data}=await supabaseClient
.from("profiles")
.select("username")
.eq("id",currentUser.id)
.single();

if(data?.username){
username=data.username;
}

}catch(error){

console.log(error);

}

document.getElementById("profileName")
.textContent=username||"User";

document.getElementById("profileEmail")
.textContent=currentUser.email||"-";

try{

const {count}=await supabaseClient
.from("videos")
.select("*",{count:"exact",head:true})
.eq("user_id",currentUser.id);

document.getElementById("videoCount")
.textContent=count||0;

}catch(error){

console.log(error);

}

}


/* SECURITY HELPERS */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJs(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


/* START */

checkSession();

</script>

</body>
</html>
