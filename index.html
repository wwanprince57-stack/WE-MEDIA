 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
  padding-bottom:80px;
}

header{
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#00d9ff;
}

.login{
  background:#00d9ff;
  border:0;
  padding:9px 15px;
  border-radius:8px;
  font-weight:bold;
}

main{
  max-width:650px;
  margin:auto;
}

.video-card{
  background:#151515;
  margin:12px 8px;
  border-radius:12px;
  overflow:hidden;
}

video{
  width:100%;
  max-height:70vh;
  display:block;
  background:#000;
}

.info{
  padding:14px;
}

.username{
  font-weight:bold;
  margin-bottom:7px;
}

.caption{
  margin-bottom:12px;
  color:#ddd;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  background:#292929;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 12px;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:#aaa;
}

.loading{
  text-align:center;
  padding:30px;
  color:#aaa;
}

.progress-box{
  margin:20px;
  background:#181818;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:#00d9ff;
  transition:width .2s;
}

#fileInput{
  display:none;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#111;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

nav button{
  background:none;
  color:white;
  border:0;
  font-size:13px;
}

.upload{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#00d9ff;
  color:#000;
  font-size:28px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">We <span>Media</span></div>
  <button class="login" onclick="login()">LOGIN</button>
</header>

<main id="feed">
  <div class="loading">Loading videos...</div>
</main>

<input
  type="file"
  id="fileInput"
  accept="video/*"
  onchange="uploadVideo(event)"
>

<nav>
  <button onclick="home()">🏠<br>Home</button>

  <button class="upload" onclick="chooseVideo()">+</button>

  <button onclick="profile()">👤<br>Profile</button>
</nav>

<script>

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* LOAD VIDEOS */

async function loadVideos(){

  const feed = document.getElementById("feed");

  const { data, error } =
    await supabaseClient
      .from("videos")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    console.error(error);

    feed.innerHTML =
      '<div class="empty">Could not load videos.</div>';

    return;
  }

  if(!data || data.length === 0){

    feed.innerHTML =
      '<div class="empty">🎥<br><br>No videos yet.<br>Tap + to upload your first video.</div>';

    return;
  }

  feed.innerHTML = "";

  data.forEach(video => {

    const card =
      document.createElement("div");

    card.className = "video-card";

    card.innerHTML = `
      <video controls playsinline>
        <source src="${video.video_url}">
      </video>

      <div class="info">

        <div class="username">
          @wemedia_user
        </div>

        <div class="caption">
          ${escapeHTML(video.title || "My video 🎥🔥")}
        </div>

        <div class="actions">

          <button onclick="likeVideo(this)">
            ❤️ Like
          </button>

          <button onclick="commentVideo()">
            💬 Comment
          </button>

          <button onclick="shareVideo('${video.video_url}')">
            ↗ Share
          </button>

        </div>

      </div>
    `;

    feed.appendChild(card);

  });

}


/* CHOOSE VIDEO */

function chooseVideo(){

  document
    .getElementById("fileInput")
    .click();

}


/* UPLOAD VIDEO */

async function uploadVideo(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("video/")){

    alert("Please choose a video.");

    return;
  }

  const feed =
    document.getElementById("feed");

  feed.innerHTML = `
    <div class="progress-box">

      <div id="uploadText">
        Preparing upload... ⏳
      </div>

      <div class="progress-bar">
        <div
          id="progressFill"
          class="progress-fill">
        </div>
      </div>

      <div id="progressPercent">
        0%
      </div>

    </div>
  `;


  const fileName =
    Date.now() + "_" +
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const filePath =
    "uploads/" + fileName;


  /* IMPORTANT:
     Bucket yako inaitwa Videos
  */

  const { error: uploadError } =
    await supabaseClient.storage
      .from("Videos")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(uploadError){

    console.error(uploadError);

    alert(
      "Upload failed: " +
      uploadError.message
    );

    loadVideos();

    return;
  }


  document.getElementById("uploadText")
    .innerText =
    "Saving video information...";


  document.getElementById("progressFill")
    .style.width = "90%";

  document.getElementById("progressPercent")
    .innerText = "90%";


  /* GET PUBLIC URL */

  const { data: publicData } =
    supabaseClient.storage
      .from("Videos")
      .getPublicUrl(filePath);


  const videoURL =
    publicData.publicUrl;


  /* SAVE TO DATABASE */

  const { error: databaseError } =
    await supabaseClient
      .from("videos")
      .insert({

        title:file.name,

        video_url:videoURL

      });


  if(databaseError){

    console.error(databaseError);

    alert(
      "Video uploaded, but database save failed: " +
      databaseError.message
    );

    loadVideos();

    return;
  }


  document.getElementById("progressFill")
    .style.width = "100%";

  document.getElementById("progressPercent")
    .innerText = "100%";

  document.getElementById("uploadText")
    .innerText =
    "Upload complete! 🎉";


  event.target.value = "";


  setTimeout(() => {

    loadVideos();

  }, 800);

}


/* LIKE */

function likeVideo(button){

  if(
    button.innerText.includes("Liked")
  ){

    button.innerText =
      "❤️ Like";

  }else{

    button.innerText =
      "❤️ Liked";

  }

}


/* COMMENT */

function commentVideo(){

  const comment =
    prompt("Write your comment:");

  if(comment){

    alert(
      "Comment added: " +
      comment
    );

  }

}


/* SHARE */

async function shareVideo(url){

  if(navigator.share){

    try{

      await navigator.share({

        title:"We Media",

        text:
          "Check out this video on We Media!",

        url:url

      });

    }catch(e){}

  }else{

    try{

      await navigator.clipboard
        .writeText(url);

      alert(
        "Video link copied!"
      );

    }catch(e){

      alert("Copy failed.");

    }

  }

}


/* LOGIN */

function login(){

  alert(
    "Login system coming next."
  );

}


/* PROFILE */

function profile(){

  alert(
    "Profile system coming next."
  );

}


/* HOME */

function home(){

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* SECURITY */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* START */

loadVideos();

</script>

</body>
</html>
