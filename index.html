<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

:root{
--blue:#1687ff;
--blue2:#0066ff;
--dark:#050b14;
--card:#0b1420;
--border:#17283c;
--muted:#8292a5;
}

body{
background:var(--dark);
color:#fff;
min-height:100vh;
padding-top:60px;
padding-bottom:70px;
}

button{
border:0;
cursor:pointer;
color:#fff;
}

input{
outline:none;
}

button:active{
transform:scale(.96);
}

/* TOP */

.top{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#07111d;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
z-index:1000;
padding:0 10px;
}

.logo{
font-size:21px;
font-weight:bold;
}

.top-actions{
margin-left:auto;
display:flex;
gap:5px;
}

.top-btn{
background:#102238;
width:38px;
height:38px;
border-radius:50%;
font-size:18px;
}

/* PAGES */

.page{
display:none;
min-height:calc(100vh - 130px);
}

.page.active{
display:block;
}

/* CARD */

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:15px;
margin:12px;
padding:15px;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:13px;
}

.muted{
color:var(--muted);
font-size:13px;
}

.field{
margin-bottom:12px;
}

.field input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #20354d;
background:#081321;
color:#fff;
}

/* BUTTONS */

.primary{
width:100%;
padding:14px;
border-radius:11px;
background:linear-gradient(
135deg,#1687ff,#005ce6
);
font-weight:bold;
}

.secondary{
width:100%;
padding:13px;
border-radius:11px;
background:#102238;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:68px;
background:#07111d;
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
z-index:1000;
}

.nav{
background:none;
font-size:10px;
color:#77889b;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
min-width:55px;
}

.nav-icon{
font-size:22px;
}

.nav.active{
color:var(--blue);
}

.post-button{
width:48px;
height:44px;
border-radius:14px;
background:linear-gradient(
135deg,#1687ff,#005ce6
);
font-size:28px;
font-weight:bold;
}

/* VIDEO */

.video-card{
margin-bottom:18px;
background:#07111d;
border-bottom:1px solid var(--border);
position:relative;
}

.video-wrap{
position:relative;
background:#000;
}

.feed-video{
width:100%;
height:auto;
max-height:76vh;
min-height:220px;
display:block;
object-fit:contain;
background:#000;
}

.video-info{
padding:10px 13px 5px;
}

.video-user{
display:flex;
align-items:center;
gap:8px;
margin-bottom:8px;
cursor:pointer;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#17314d;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:17px;
flex-shrink:0;
}

.video-title{
font-size:14px;
line-height:1.4;
color:#e9f2ff;
}

.video-actions{
position:absolute;
right:8px;
bottom:75px;
display:flex;
flex-direction:column;
gap:11px;
z-index:20;
}

.side-action{
width:48px;
height:48px;
border-radius:50%;
background:rgba(5,15,27,.78);
border:1px solid rgba(255,255,255,.1);
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
}

.side-action span{
display:block;
font-size:10px;
margin-top:2px;
}

.sound-used{
padding:9px 13px;
font-size:12px;
color:#8ea1b7;
border-top:1px solid #101e2d;
}

/* PROFILE */

.profile-head{
text-align:center;
padding:25px 12px;
}

.big-avatar{
width:90px;
height:90px;
border-radius:50%;
background:#17314d;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
margin:auto;
border:3px solid var(--blue);
}

.profile-name{
font-size:21px;
font-weight:bold;
margin-top:10px;
}

.profile-username{
font-size:13px;
color:var(--muted);
margin-top:4px;
}

.profile-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:2px;
}

.grid-video{
width:100%;
height:160px;
object-fit:cover;
background:#000;
}

/* SEARCH */

.search-result{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--border);
cursor:pointer;
}

/* COMMENTS */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
z-index:3000;
align-items:flex-end;
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
background:#081321;
border-radius:20px 20px 0 0;
padding:15px;
max-height:82vh;
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.close-btn{
width:36px;
height:36px;
border-radius:50%;
background:#14263b;
}

.comment-item{
padding:11px 0;
border-bottom:1px solid var(--border);
}

.comment-text{
font-size:14px;
margin-top:4px;
color:#dce8f5;
}

/* AUTH */

.auth-box{
margin-top:30px;
}

.password-wrap{
position:relative;
}

.password-wrap input{
padding-right:50px;
}

.show-pass{
position:absolute;
right:7px;
top:7px;
width:38px;
height:38px;
background:#102238;
border-radius:8px;
}

/* UPLOAD */

.preview-video{
width:100%;
max-height:350px;
border-radius:12px;
background:#000;
display:none;
object-fit:contain;
}

.empty{
padding:45px 20px;
text-align:center;
color:var(--muted);
}

.loading{
padding:35px;
text-align:center;
color:var(--muted);
}

.error{
padding:25px;
color:#ff7070;
text-align:center;
}

/* PROFILE */

.profile-actions{
display:flex;
gap:8px;
margin:15px 12px;
}

.profile-actions button{
flex:1;
}

/* DESKTOP */

@media(min-width:700px){

.video-card{
max-width:700px;
margin:0 auto 20px;
}

.card{
max-width:700px;
margin-left:auto;
margin-right:auto;
}

}

</style>
</head>

<script>

const SUPABASE_URL =
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let selectedVideoId=null;
let selectedProfileId=null;


function $(id){
return document.getElementById(id);
}


function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showPage(page){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

const target =
$(page+"Page");

if(target){
target.classList.add("active");
}

document
.querySelectorAll(".nav")
.forEach(n=>{
n.classList.remove("active");
});

if(page==="home"){
$("navHome")?.classList.add("active");
}

if(page==="messages"){
$("navMessages")?.classList.add("active");
}

if(page==="profile"){
$("navProfile")?.classList.add("active");
}

window.scrollTo(0,0);

if(page==="home"){
loadFeed();
}

if(page==="profile" && user){
loadMyProfile();
}

if(page==="notifications"){
loadNotifications();
}

}


function requireLogin(){

if(!user){

alert("Please login first.");

showPage("login");

return false;

}

return true;

}


function togglePassword(id,button){

const input=$(id);

if(!input)return;

if(input.type==="password"){

input.type="text";

button.textContent="🙈";

}else{

input.type="password";

button.textContent="👁";

}

}


/* =========================
REGISTER
========================= */

async function register(){

const name =
$("regName").value.trim();

const phone =
$("regPhone").value.trim();

const email =
$("regEmail").value.trim();

const password =
$("regPass").value;

if(!name || !phone || !password){

alert(
"Fill username, phone and password."
);

return;

}

if(password.length<6){

alert(
"Password must be at least 6 characters."
);

return;

}

const {data,error} =
await sb.auth.signUp({

phone:phone,

password:password,

options:{
data:{
username:name,
email:email
}
}

});

if(error){

alert(error.message);

return;

}

if(!data.user){

alert(
"Account creation failed."
);

return;

}


/* PROFILE ONLY USES
   REAL DATABASE COLUMNS */

const profile={
id:data.user.id,
username:name
};

if(email){
profile.email=email;
}

const {error:profileError} =
await sb
.from("profiles")
.upsert(
profile,
{
onConflict:"id"
}
);

if(profileError){

console.log(profileError);

alert(
"Account created, but profile could not be saved:\n"+
profileError.message
);

return;

}

alert(
"✅ Account created successfully."
);

$("regPass").value="";

showPage("login");

}


/* =========================
LOGIN
========================= */

async function login(){

const phone =
$("loginPhone").value.trim();

const password =
$("loginPass").value;

if(!phone || !password){

alert(
"Enter phone and password."
);

return;

}

const {data,error} =
await sb.auth.signInWithPassword({

phone:phone,
password:password

});

if(error){

alert(error.message);

return;

}

user=data.user;

alert(
"✅ Welcome to We Media"
);

showPage("home");

await loadFeed();

}


/* =========================
LOGOUT
========================= */

async function logout(){

await sb.auth.signOut();

user=null;

showPage("login");

}


/* =========================
PROFILE
========================= */

async function getProfile(id){

const {data,error} =
await sb
.from("profiles")
.select("*")
.eq("id",id)
.maybeSingle();

if(error){

console.log(error);

return null;

}

return data;

}


async function loadMyProfile(){

if(!user)return;

const profile =
await getProfile(user.id);

if(!profile)return;

await renderProfile(
user.id,
profile
);

}


async function openProfile(id){

const profile =
await getProfile(id);

if(!profile){

alert(
"Profile not found."
);

return;

}

selectedProfileId=id;

await renderProfile(
id,
profile
);

showPage("profile");

}


async function renderProfile(
id,
profile
){

const username =
profile.username ||
"User";

const initial =
username
.charAt(0)
.toUpperCase();

const {data:videos} =
await sb
.from("videos")
.select("*")
.eq("user_id",id)
.order("created_at",{
ascending:false
});


let totalLikes=0;

for(const v of videos || []){

totalLikes +=
Number(v.likes || 0);

}


$("profileBox").innerHTML=`

<div class="profile-head">

<div class="big-avatar">
${escapeHtml(initial)}
</div>

<div class="profile-name">
${escapeHtml(username)}
</div>

<div class="profile-username">
@${escapeHtml(username)}
</div>

<div style="
display:flex;
justify-content:center;
gap:35px;
margin:20px 0">

<div>
<b>${videos?.length || 0}</b>
<div class="muted">Videos</div>
</div>

<div>
<b>${totalLikes}</b>
<div class="muted">Likes</div>
</div>

</div>

${
user && user.id===id
?
`
<button
class="primary"
onclick="logout()">
LOGOUT
</button>
`
:
""
}

</div>

<div
class="profile-grid"
id="profileGrid">
</div>
`;

const grid=
$("profileGrid");

for(const v of videos || []){

const url =
v.video_url ||
v.url;

if(!url)continue;

const video =
document.createElement("video");

video.className="grid-video";

video.src=url;

video.controls=true;

video.playsInline=true;

video.preload="metadata";

grid.appendChild(video);

}

}/* =========================
   FEED
========================= */

async function loadFeed(){

const box=$("feed");

if(!box)return;

box.innerHTML=`
<div class="loading">
Loading videos...
</div>
`;

const {data,error} =
await sb
.from("videos")
.select("*")
.order("created_at",{
ascending:false
});

if(error){

box.innerHTML=`
<div class="error">
${escapeHtml(error.message)}
</div>
`;

return;

}

box.innerHTML="";

if(!data || data.length===0){

box.innerHTML=`
<div class="empty">
🎥 No videos yet.<br><br>
Be the first to post a video.
</div>
`;

return;

}

for(const video of data){

await createVideoCard(
video,
box
);

}

}


/* =========================
   CREATE VIDEO CARD
========================= */

async function createVideoCard(
v,
box
){

if(!box)return;

const profile =
v.user_id
?
await getProfile(v.user_id)
:null;

const username =
profile?.username ||
v.username ||
"User";

const initial =
username
.charAt(0)
.toUpperCase();

const videoUrl =
v.video_url ||
v.url ||
"";

const card =
document.createElement("div");

card.className="video-card";

card.innerHTML=`

<div class="video-wrap">

<video
class="feed-video"
controls
playsinline
webkit-playsinline
loop
preload="metadata"
src="${escapeHtml(videoUrl)}">

Your browser does not support video playback.

</video>


<div class="video-actions">

<button
class="side-action"
onclick="likePost(
'${escapeHtml(v.id)}',
this
)">
❤️
</button>

<button
class="side-action"
onclick="commentPost(
'${escapeHtml(v.id)}'
)">
💬
</button>

<button
class="side-action"
onclick="sharePost(
'${escapeHtml(v.id)}'
)">
↗️
</button>

<button
class="side-action"
onclick="whatsappPost(
'${escapeHtml(v.id)}'
)">
🟢
</button>

<button
class="side-action"
onclick="showSound(
'Original sound'
)">
🎵
</button>

</div>

</div>


<div class="video-info">

<div
class="video-user"
onclick="openProfile(
'${escapeHtml(v.user_id || "")}'
)">

<div class="avatar">
${escapeHtml(initial)}
</div>

<strong>
@${escapeHtml(username)}
</strong>

</div>

<div class="video-title">

${escapeHtml(
v.title || ""
)}

</div>

</div>

<div class="sound-used">
🎵 Original sound
</div>

`;

box.appendChild(card);


/*
IMPORTANT:
Check whether URL really loads.
*/

const media =
card.querySelector(".feed-video");

if(!media){

return;

}


/* VIDEO ERROR */

media.addEventListener(
"error",
()=>{

console.log(
"Video failed to load:",
videoUrl
);

const errorBox =
document.createElement("div");

errorBox.style.padding="15px";

errorBox.style.color="#ff7070";

errorBox.textContent=
"⚠️ Video could not be loaded.";

media.parentNode
.insertBefore(
errorBox,
media
);

},
{
once:true
}
);


/* VIDEO LOADED */

media.addEventListener(
"loadedmetadata",
()=>{

console.log(
"Video loaded successfully:",
videoUrl
);

},
{
once:true
}
);

}


/* =========================
   LIKE
========================= */

async function likePost(
videoId,
button
){

if(!requireLogin())return;


/*
Your current database has
videos.likes.
We use that instead of
a missing likes table.
*/

const {data:video,error} =
await sb
.from("videos")
.select("likes")
.eq("id",videoId)
.maybeSingle();

if(error){

alert(error.message);

return;

}

if(!video)return;


/*
Simple toggle stored locally
for this browser.
*/

const key=
"wemedia_like_"+videoId;

const alreadyLiked =
localStorage.getItem(key)==="1";

let likes =
Number(video.likes || 0);

if(alreadyLiked){

likes=Math.max(
0,
likes-1
);

localStorage.removeItem(key);

button.textContent="🤍";

}else{

likes++;

localStorage.setItem(
key,
"1"
);

button.textContent="💙";

}


const {error:updateError} =
await sb
.from("videos")
.update({
likes:likes
})
.eq("id",videoId);

if(updateError){

alert(updateError.message);

return;

}

}


/* =========================

async function commentPost(
videoId
){

if(!requireLogin())return;

selectedVideoId=videoId;

$("commentModal");

if(modal){

modal.classList.add("show");

async function loadComments(){

const box=
$("commentsList");

if(!box ||
!selectedVideoId)return;

box.innerHTML=
"<div class='muted'>Loading comments...</div>";


const {data,error} =
await sb
.from("comments")
.select("*")
.eq(
"video_id",
selectedVideoId
)
.order(
"created_at",
{
ascending:true
}
);

if(error){

box.innerHTML=`
<div class="error">
${escapeHtml(
error.message
)}
</div>
`;

return;

}

box.innerHTML="";

if(!data || data.length===0){

box.innerHTML=`
<div class="empty">
No comments yet.
</div>
`;

return;

}


for(const c of data){

const div =
document.createElement("div");

div.className=
"comment-item";


/*
Your comments table does
NOT have user_id.

Therefore we don't try
to read c.user_id.
*/

div.innerHTML=`

<div>
<strong>
We Media user
</strong>

<div class="comment-text">
${escapeHtml(
c.comment || ""
)}
</div>

</div>

`;

box.appendChild(div);

}

}


/* =========================
   SEND COMMENT
========================= */

async function sendComment(){

if(!requireLogin())return;

if(!selectedVideoId){

alert(
"Select a video first."
);

return;

}

const input=
$("commentInput");

if(!input)return;

const text=
input.value.trim();

if(!text)return;


/*
IMPORTANT:
comments table currently
has no user_id.
So insert ONLY columns
that actually exist.
*/

const {error} =
await sb
.from("comments")
.insert({

video_id:selectedVideoId,
comment:text

});

if(error){

alert(error.message);

return;

}

input.value="";

await loadComments();

}

/* =========================
   SHARE
========================= */

async function sharePost(id){

const url=
window.location.origin+
window.location.pathname+
"?video="+
encodeURIComponent(id);

if(navigator.share){

try{

await navigator.share({

title:"We Media",

text:
"Check this video on We Media 👇",

url:url

});

}catch(e){

console.log(e);

}

return;

}

try{

await navigator.clipboard
.writeText(url);

alert(
"✅ Video link copied"
);

}catch(e){

prompt(
"Copy this link:",
url
);

}

}

/* =========================
   PREVIEW
========================= */

function previewPost(){

const input=
$("videoFile");

const preview=
$("videoPreview");

if(!input ||
!preview)return;

const file=
input.files?.[0];

if(!file){

preview.removeAttribute("src");

preview.style.display="none";

return;

}


/*
Only preview video files.
*/

if(!file.type.startsWith(
"video/"
)){

alert(
"Please choose a video file."
);

input.value="";

return;

}

const oldUrl=
preview.dataset.objectUrl;

if(oldUrl){

URL.revokeObjectURL(
oldUrl
);

}

const url=
URL.createObjectURL(file);

preview.dataset.objectUrl=url;

preview.src=url;

preview.style.display=
"block";

preview.load();

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadPost(){

if(!requireLogin())return;

const input=
$("videoFile");

const msg=
$("uploadMsg");

if(!input)return;

const file=
input.files?.[0];

if(!file){

alert(
"Select a video first."
);

return;

}

if(!file.type.startsWith(
"video/"
)){

alert(
"The selected file is not a video."
);

return;

}


if(msg){

msg.textContent=
"Uploading video...";
}


/*
Keep original extension.
*/

let ext=
file.name
.split(".")
.pop()
.toLowerCase();

if(!ext ||
ext.length>8){

ext="mp4";

}

const path=
`videos/${user.id}/video_${Date.now()}.${ext}`;


const {error:uploadError} =
await sb
.storage
.from("Videos")
.upload(
path,
file,
{
upsert:false,
contentType:
file.type ||
"video/mp4",
cacheControl:"3600"
}
);


if(uploadError){

if(msg){
msg.textContent="";
}

alert(
"Upload failed:\n"+
uploadError.message
);

return;

}


const {data:urlData} =
sb.storage
.from("Videos")
.getPublicUrl(path);

const videoUrl=
urlData.publicUrl;


if(!videoUrl){

alert(
"Could not create video URL."
);

return;

}


const title=
$("videoTitle")
?.value
.trim() || "";


/*
Save BOTH url columns.
This makes the feed work even
if older code reads url.
*/

const {error:dbError} =
await sb
.from("videos")
.insert({

user_id:user.id,

username:
user.user_metadata
?.username ||
user.user_metadata
?.full_name ||
"user",

title:title,

video_url:videoUrl,

url:videoUrl,

file_name:file.name,

likes:0,

views:0

});


if(dbError){

alert(
"Video uploaded, but database save failed:\n"+
dbError.message
);

return;

}


if(msg){

msg.textContent=
"✅ Video posted successfully.";
}


input.value="";

const preview=
$("videoPreview");

if(preview){

if(preview.dataset.objectUrl){

URL.revokeObjectURL(
preview.dataset.objectUrl
);

}

preview.removeAttribute("src");

preview.dataset.objectUrl="";

preview.style.display="none";

}


if($("videoTitle")){
$("videoTitle").value="";
}


setTimeout(
()=>{

showPage("home");

loadFeed();

},
500
);

async function loadMessages(){

if(!user)return;

const box=$("messagesList");

if(!box)return;

box.innerHTML=
"<div class='muted'>Loading messages...</div>";

const {data,error}=await sb
.from("messages")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
)
.order("created_at",{ascending:true});

if(error){

box.innerHTML=`
<div class="error">
${escapeHtml(error.message)}
</div>
`;

return;
}

box.innerHTML="";

if(!data || data.length===0){

box.innerHTML=`
<div class="empty">
💬 No messages yet.
</div>
`;

return;
}

for(const m of data){

const mine=
m.sender_id===user.id;

const otherId=
mine ? m.receiver_id : m.sender_id;

const profile=
await getProfile(otherId);

const username=
profile?.username || "User";

const messageText=
m.message || m.text || "";

const div=
document.createElement("div");

div.className=
mine ? "message mine" : "message";

div.innerHTML=`

<div class="message-user">
@${escapeHtml(username)}
</div>

<div class="message-text">
${escapeHtml(messageText)}
</div>

`;

box.appendChild(div);

}

}

async function sendMessage(){

if(!requireLogin())return;

const receiver=$("receiverId");
const input=$("messageInput");

if(!receiver || !input)return;

const receiverId=
receiver.value.trim();

input.value.trim();

alert("Enter the user's ID.");

return;
}

if(!message)return;

const {error}=await sb
.from("messages")
.insert({

sender_id:user.id,
receiver_id:receiverId,
message:message,
text:message,
is_read:false

});

if(error){

alert(
"Message failed:\n"+
error.message
);

return;
}

input.value="";

await loadMessages();

}

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page){

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

const target=$(page);

if(target){

target.classList.add("active");

}

window.scrollTo({
top:0,
behavior:"smooth"
});

if(page==="home"){

loadFeed();

}

if(page==="notifications"){

loadNotifications();

}

if(page==="messages"){

loadMessages();

}

if(page==="suggestions"){

loadSuggestions();

}

if(page==="profile" && user){

loadMyProfile();

}

}

new URLSearchParams(
window.location.search
);

const videoId=
params.get("video");

if(!videoId)return;

const {data,error}=await sb
.from("videos")
.select("*")
.eq("id",videoId)
.maybeSingle();

data,
feed
);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
