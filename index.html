<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">
<title>We Media</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif
}

body{
 background:#050505;
 color:#fff;
 font-size:12px;
 padding-bottom:60px
}

button{
 border:0;
 cursor:pointer
}

input,textarea{
 outline:0
}

:root{
 --blue:#1877f2;
 --bg:#050505;
 --card:#111;
 --line:#252525;
 --muted:#999
}

header{
 position:fixed;
 top:0;
 left:0;
 right:0;
 height:52px;
 z-index:1000;
 background:#050505;
 border-bottom:1px solid #222;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 10px
}

.logo{
 color:#2187ff;
 font-size:19px;
 font-weight:bold
}

.hright{
 display:flex;
 gap:7px
}

.hbtn{
 width:34px;
 height:34px;
 border-radius:50%;
 background:#171717;
 color:#fff;
 font-size:16px
}

main{
 padding-top:52px;
 min-height:100vh
}

.page{
 display:none
}

.page.active{
 display:block
}

.feed{
 max-width:700px;
 margin:auto
}

.video-card{
 position:relative;
 width:100%;
 min-height:calc(100vh - 110px);
 background:#000;
 overflow:hidden;
 border-bottom:1px solid #222
}

.video-card video{
 width:100%;
 height:calc(100vh - 160px);
 object-fit:cover;
 display:block
}

.video-info{
 position:absolute;
 left:10px;
 right:75px;
 bottom:15px;
 z-index:5;
 text-shadow:0 1px 5px #000
}

.video-user{
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px
}

.video-title{
 font-size:11px;
 line-height:1.4
}

.actions{
 position:absolute;
 right:6px;
 bottom:70px;
 z-index:10;
 display:flex;
 flex-direction:column;
 gap:13px
}

.act{
 width:48px;
 background:transparent;
 color:#fff;
 text-shadow:0 1px 4px #000
}

.act b{
 display:block;
 font-size:27px
}

.act small{
 font-size:8px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:60px;
 z-index:2000;
 background:#080808;
 border-top:1px solid #222;
 display:flex
}

.nav{
 flex:1;
 background:transparent;
 color:#888;
 font-size:8px
}

.nav span{
 display:block;
 font-size:20px;
 margin-bottom:2px
}

.nav.active{
 color:#2187ff
}

.box{
 padding:15px
}

.card{
 background:#111;
 border:1px solid #252525;
 border-radius:12px;
 padding:15px;
 margin:12px auto;
 max-width:400px
}

.field{
 width:100%;
 height:39px;
 margin:6px 0 10px;
 padding:0 10px;
 border-radius:8px;
 border:1px solid #333;
 background:#181818;
 color:#fff;
 font-size:11px
}

.primary{
 width:100%;
 height:39px;
 border-radius:8px;
 background:#1877f2;
 color:#fff;
 font-size:11px;
 font-weight:bold
}

.muted{
 color:#888;
 font-size:10px
}

.hidden{
 display:none!important
}
</style>
</head>

<body>

<header>
<div class="logo">We Media</div>

<div class="hright">
<button class="hbtn"
onclick="showPage('search')">🔍</button>

<button class="hbtn"
onclick="showPage('notifications')">🔔</button>

<button class="hbtn"
onclick="showPage('messages')">💬</button>
</div>
</header>

<main>

<section id="homePage" class="page active">
<div id="feed" class="feed">
<div class="box muted">
Loading videos...
</div>
</div>
</section>

<section id="searchPage" class="page">
<div class="box">

<input id="searchInput"
class="field"
placeholder="🔍 Search..."
oninput="searchUsers()">

<div id="searchResults"></div>

</div>
</section>

<section id="notificationsPage" class="page">
<div class="box">
<h3>🔔 Notifications</h3>
<div id="notificationsList"></div>
</div>
</section>

<section id="messagesPage" class="page">
<div class="box">
<h3>💬 Messages</h3>
<div id="messagesList"></div>
</div>
</section>

<section id="profilePage" class="page">
<div id="profileBox" class="box">
Loading profile...
</div>
</section>

<section id="uploadPage" class="page">
<div class="card">

<h3>🎥 Post Video</h3>

<input id="videoTitle"
class="field"
placeholder="Video title">

<input id="videoFile"
class="field"
type="file"
accept="video/*">

<div id="uploadMsg" class="muted"></div>

<button class="primary"
onclick="uploadVideo()">
POST VIDEO
</button>

</div>
</section>

<section id="loginPage" class="page">
<div class="card">

<h3>Login</h3>

<input id="loginId"
class="field"
placeholder="Email or phone number">

<input id="loginPass"
class="field"
type="password"
placeholder="Password - 6+ characters">

<div id="loginMsg"></div>

<button class="primary"
onclick="login()">
LOGIN
</button>

</div>
</section>

<section id="registerPage" class="page">
<div class="card">

<h3>Create Account</h3>

<input id="regName"
class="field"
placeholder="Username">

<input id="regEmail"
class="field"
placeholder="Email">

<input id="regPhone"
class="field"
placeholder="Phone number">

<input id="regPass"
class="field"
type="password"
placeholder="Password - 6+ characters">

<div id="regMsg"></div>

<button class="primary"
onclick="register()">
CREATE ACCOUNT
</button>

</div>
</section>

</main>

<nav class="bottom">

<button id="homeNav"
class="nav active"
onclick="showPage('home')">
<span>🏠</span>Home
</button>

<button id="searchNav"
class="nav"
onclick="showPage('search')">
<span>🔍</span>Search
</button>

<button id="uploadNav"
class="nav"
onclick="showPage('upload')">
<span>➕</span>Post
</button>

<button id="messagesNav"
class="nav"
onclick="showPage('messages')">
<span>💬</span>Chat
</button>

<button id="profileNav"
class="nav"
onclick="showPage('profile')">
<span>👤</span>Profile
</button>

</nav>

<script>

const SUPABASE_URL=
"https://jhxbfkpcinetbuwsnxcz.supabase.co";

const SUPABASE_KEY=
"sb_publishable_proQL6FdqoZPDSGI4RKW2Q_EfojBAij";

const sb=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let user=null;
let currentVideo=null;

function $(id){
 return document.getElementById(id);
}

function showPage(name){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

const page=$(name+"Page");

if(page)page.classList.add("active");

document.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

const nav=$(name+"Nav");

if(nav)nav.classList.add("active");

if(name==="home")loadVideos();
if(name==="profile")loadProfile();
if(name==="notifications")loadNotifications();
if(name==="messages")loadMessages();

}

  </script>
  <script>

/* =========================
   AUTH
========================= */

async function register(){

const name=$("regName").value.trim();
const email=$("regEmail").value.trim();
const phone=$("regPhone").value.trim();
const pass=$("regPass").value;

if(!name){
alert("Enter your name");
return;
}

if(!email && !phone){
alert("Enter email or phone number");
return;
}

if(pass.length<6){
alert("Password must be at least 6 characters");
return;
}

const identity=email||phone;

const {data,error}=await sb.auth.signUp({
email:identity,
password:pass,
options:{
data:{
username:name,
phone:phone
}
}
});

if(error){
alert(error.message);
return;
}

if(data.user){

await sb.from("profiles").upsert({
id:data.user.id,
username:name,
email:email||null
});

user=data.user;

alert("✅ Account created successfully");

showPage("home");
loadVideos();

}

}


/* =========================
   LOGIN
========================= */

async function login(){

const identity=$("loginIdentity").value.trim();
const pass=$("loginPass").value;

if(!identity||!pass){
alert("Enter your login details");
return;
}

let result;

if(identity.includes("@")){

result=await sb.auth.signInWithPassword({
email:identity,
password:pass
});

}else{

result=await sb.auth.signInWithPassword({
phone:identity,
password:pass
});

}

if(result.error){
alert("❌ "+result.error.message);
return;
}

user=result.data.user;

alert("✅ Login successful");

showPage("home");
loadVideos();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

const {error}=await sb.auth.signOut();

if(error){
alert(error.message);
return;
}

user=null;

showPage("login");

}


/* =========================
   CHECK SESSION
========================= */

async function checkUser(){

const {data}=await sb.auth.getSession();

if(data.session){

user=data.session.user;

showPage("home");

}else{

showPage("login");

}

}

             </script><script>

/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

const box=$("videoFeed");

if(!box)return;

box.innerHTML=
"<div class='loading'>Loading videos...</div>";

const {data,error}=await sb
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){

box.innerHTML=
"<div class='loading'>❌ "+error.message+"</div>";

return;
}

box.innerHTML="";

if(!data||!data.length){

box.innerHTML=
"<div class='loading'>No videos yet 🎥</div>";

return;
}

for(const v of data){

await createVideo(v,box);

}

}


/* =========================
   VIDEO CARD
========================= */

async function createVideo(v,box){

const card=document.createElement("div");

card.className="video-card";

const url=v.video_url||v.url||"";

let username="User";

const {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",v.user_id)
.maybeSingle();

if(p?.username){

username=p.username;

}

card.innerHTML=`

<video
class="main-video"
src="${url}"
controls
playsinline
loop>
</video>

<div class="video-info">

<b>@${username}</b>

<div>${v.title||""}</div>

</div>

<div class="video-actions">

<button onclick="likeVideo('${v.id}')">
❤️
</button>

<button onclick="commentVideo('${v.id}')">
💬
</button>

<button onclick="shareVideo('${v.id}')">
↗️
</button>

</div>

`;

box.appendChild(card);

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo(){

if(!user){

showPage("login");

return;
}

const title=$("videoTitle").value.trim();

const file=$("videoFile").files[0];

if(!file){

alert("Select a video first");

return;
}

if(file.size>50*1024*1024){

alert("Video must be below 50MB");

return;
}

const ext=file.name.split(".").pop();

const path=
user.id+"/"+Date.now()+"."+ext;

const {error:uploadError}=await sb
.storage
.from("Videos")
.upload(path,file,{
upsert:false,
contentType:file.type
});

if(uploadError){

alert("❌ "+uploadError.message);

return;
}

const {data}=sb
.storage
.from("Videos")
.getPublicUrl(path);

const {error:dbError}=await sb
.from("videos")
.insert({

user_id:user.id,
title:title,
video_url:data.publicUrl

});

if(dbError){

alert("❌ "+dbError.message);

return;
}

$("videoTitle").value="";
$("videoFile").value="";

alert("✅ Video uploaded successfully");

showPage("home");

loadVideos();

}

             </script><script>

/* =========================
   LIKE VIDEO
========================= */

async function likeVideo(videoId){

if(!user){
showPage("login");
return;
}

const {data:old}=await sb
.from("likes")
.select("id")
.eq("video_id",videoId)
.eq("user_id",user.id)
.maybeSingle();

if(old){

await sb
.from("likes")
.delete()
.eq("id",old.id);

}else{

await sb
.from("likes")
.insert({
video_id:videoId,
user_id:user.id
});

}

loadVideos();

}


/* =========================
   COMMENTS
========================= */

async function commentVideo(videoId){

if(!user){
showPage("login");
return;
}

const comment=prompt("Write your comment:");

if(!comment||!comment.trim())return;

const {error}=await sb
.from("comments")
.insert({
video_id:videoId,
user_id:user.id,
comment:comment.trim()
});

if(error){

alert("❌ "+error.message);
return;

}

alert("✅ Comment added");

}


/* =========================
   SHARE VIDEO
========================= */

async function shareVideo(videoId){

const link=
location.origin+
location.pathname+
"?video="+videoId;

if(navigator.share){

try{

await navigator.share({
title:"We Media",
text:"Check this video on We Media",
url:link
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(link);

alert("✅ Video link copied");

}catch(e){

prompt(
"Copy this video link:",
link
);

}

}

}

             </script><script>

/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function followUser(targetId){

if(!user){
showPage("login");
return;
}

if(targetId===user.id)return;

const {data:old}=await sb
.from("follows")
.select("id")
.eq("follower_id",user.id)
.eq("following_id",targetId)
.maybeSingle();

if(old){

await sb
.from("follows")
.delete()
.eq("id",old.id);

}else{

const {error}=await sb
.from("follows")
.insert({
follower_id:user.id,
following_id:targetId
});

if(error){

alert("❌ "+error.message);
return;

}

}

loadProfile();

}


/* =========================
   NOTIFICATIONS
========================= */

async function loadNotifications(){

const box=$("notificationsList");

if(!box)return;

if(!user){

box.innerHTML="Login to see notifications";
return;

}

const {data,error}=await sb
.from("follows")
.select("id,follower_id,created_at")
.eq("following_id",user.id)
.order("created_at",{ascending:false});

if(error){

box.innerHTML="❌ "+error.message;
return;

}

box.innerHTML="";

if(!data?.length){

box.innerHTML="No notifications 🔔";
return;

}

for(const item of data){

let name="Someone";

const {data:p}=await sb
.from("profiles")
.select("username")
.eq("id",item.follower_id)
.maybeSingle();

if(p?.username)name=p.username;

const div=document.createElement("div");

div.className="notification";

div.innerHTML=
"👤 <b>@"+name+
"</b> followed you";

box.appendChild(div);

}

}


/* =========================
   FOLLOW COUNTS
========================= */

async function getFollowCounts(id){

const followers=await sb
.from("follows")
.select("id",{count:"exact",head:true})
.eq("following_id",id);

const following=await sb
.from("follows")
.select("id",{count:"exact",head:true})
.eq("follower_id",id);

return{
followers:followers.count||0,
following:following.count||0
};

}

             </script><script>

/* =========================
   PROFILE
========================= */

async function loadProfile(){

if(!user)return;

const box=$("profileContent");

if(!box)return;

const {data:p}=await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

const counts=
await getFollowCounts(user.id);

box.innerHTML=`

<div class="profile-head">

<div class="avatar">
👤
</div>

<h2>${p?.username||"User"}</h2>

<p>${user.email||""}</p>

</div>

<div class="stats">

<div>
<b>${counts.followers}</b>
<span>Followers</span>
</div>

<div>
<b>${counts.following}</b>
<span>Following</span>
</div>

</div>

<button onclick="logout()" class="blue-btn">
LOGOUT
</button>

`;

}


/* =========================
   SEARCH
========================= */

async function searchUsers(){

const q=$("searchInput").value.trim();

const box=$("searchResults");

if(!box)return;

if(!q){

box.innerHTML="";
return;

}

const {data,error}=await sb
.from("profiles")
.select("id,username")
.ilike("username","%"+q+"%")
.limit(20);

if(error){

box.innerHTML="❌ "+error.message;
return;

}

box.innerHTML="";

if(!data?.length){

box.innerHTML="No users found";
return;

}

for(const p of data){

const div=document.createElement("div");

div.className="search-user";

div.innerHTML=`

<b>@${p.username||"User"}</b>

<button onclick="followUser('${p.id}')">
Follow
</button>

`;

box.appendChild(div);

}

}


/* =========================
   PROFILE PAGE
========================= */

async function openMyProfile(){

showPage("profile");

await loadProfile();

}


/* =========================
   SEARCH PAGE
========================= */

function openSearch(){

showPage("search");

setTimeout(()=>{

$("searchInput")?.focus();

},100);

}

             </script><script>

/* =========================
   MESSAGES
========================= */

async function loadMessages(){

const box=$("messagesList");

if(!box)return;

if(!user){

box.innerHTML="Login to use messages";
return;

}

box.innerHTML=`
<div class="chat-box">
<h3>💬 Messages</h3>

<input
id="chatText"
placeholder="Write a message..."
>

<button onclick="sendMessage()">
Send
</button>

<div id="chatList"></div>
</div>
`;

await refreshMessages();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

if(!user)return;

const input=$("chatText");

const message=input.value.trim();

if(!message)return;

const {error}=await sb
.from("messages")
.insert({
sender_id:user.id,
message:message
});

if(error){

alert("❌ "+error.message);
return;

}

input.value="";

refreshMessages();

}


/* =========================
   SHOW MESSAGES
========================= */

async function refreshMessages(){

const box=$("chatList");

if(!box||!user)return;

const {data}=await sb
.from("messages")
.select("*")
.eq("sender_id",user.id)
.order("created_at",{ascending:true});

box.innerHTML="";

(data||[]).forEach(m=>{

const div=document.createElement("div");

div.className="message";

div.textContent=m.message;

box.appendChild(div);

});

}

   AI BOT DEMO

   CALL
========================= */

function startCall(){

if(!user){

showPage("login");
return;

}

alert(
"📞 Call screen opened.\n\n" +
"Select a user to start a call."
);

}

             </script><script>

/* =========================
   START APP
========================= */

document.addEventListener(
"DOMContentLoaded",
async function(){

await checkUser();

});


/* =========================
   NAVIGATION
========================= */

$("homeNav")?.addEventListener(
"click",
()=>showPage("home")
);

$("searchNav")?.addEventListener(
"click",
()=>showPage("search")
);

$("uploadNav")?.addEventListener(
"click",
()=>showPage("upload")
);

$("messagesNav")?.addEventListener(
"click",
()=>showPage("messages")
);

$("profileNav")?.addEventListener(
"click",
()=>showPage("profile")
);


/* =========================
   SEARCH BUTTON
========================= */

$("searchInput")?.addEventListener(
"input",
searchUsers
);


/* =========================
   AUTH BUTTONS
========================= */

$("loginBtn")?.addEventListener(
"click",
login
);

$("registerBtn")?.addEventListener(
"click",
register
);

$("uploadBtn")?.addEventListener(
"click",
uploadVideo
);


/* =========================
   HEADER BUTTONS
========================= */

$("homeLogo")?.addEventListener(
"click",
()=>showPage("home")
);

</script>

</body>
</html>
