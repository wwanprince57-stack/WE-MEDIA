 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Media</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:#fff;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#111;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#00d9ff;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  background:#00d9ff;
  color:#000;
}

main{
  max-width:600px;
  margin:auto;
}

.video-card{
  min-height:500px;
  margin:15px 10px;
  background:#151515;
  border-radius:14px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.video-box{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  color:#555;
}

.username{
  font-weight:bold;
  margin-bottom:8px;
}

.caption{
  margin-bottom:15px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions button{
  background:#252525;
  color:white;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#111;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

nav button{
  background:transparent;
  color:white;
  font-size:13px;
}

.upload{
  background:#00d9ff;
  color:#000;
  border-radius:50%;
  width:50px;
  height:50px;
  font-size:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">We <span>Media</span></div>
  <button class="login" onclick="login()">LOGIN</button>
</header>

<main>

<div class="video-card">
  <div class="video-box">▶</div>

  <div class="username">@wemedia_user</div>

  <div class="caption">
    Welcome to We Media 🎥🔥
  </div>

  <div class="actions">
    <button onclick="likeVideo(this)">❤️ Like</button>
    <button onclick="comment()">💬 Comment</button>
    <button onclick="shareVideo()">↗ Share</button>
  </div>
</div>

</main>

<nav>
  <button onclick="home()">🏠<br>Home</button>

  <button class="upload" onclick="uploadVideo()">+</button>

  <button onclick="profile()">👤<br>Profile</button>
</nav>

<script>

function login(){
  alert("Login page coming soon!");
}

function likeVideo(button){
  button.innerText = "❤️ Liked";
}

function comment(){
  alert("Comments coming soon!");
}

function shareVideo(){
  navigator.clipboard.writeText(window.location.href);
  alert("We Media link copied!");
}

function uploadVideo(){
  alert("Video upload coming soon!");
}

function home(){
  window.scrollTo(0,0);
}

function profile(){
  alert("Profile coming soon!");
}

</script>

</body>
</html>
